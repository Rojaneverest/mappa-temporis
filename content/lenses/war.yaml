cards:
  - id: k-chariot
    title: The war chariot
    date: c. 1600 BCE
    lane: egypt-new-kingdom
    image: w-chariot
    text: Light spoked-wheel chariots carried archers fast across the battlefields of the Bronze Age.
    cause: Two inventions of the steppe, the tamed horse and the light spoked wheel, made a fast, stable platform for an archer.
    consequence: Chariot armies became the core of every great Bronze Age power from Egypt to Shang China, and a costly chariot-owning elite ruled until the Bronze Age collapse.
    sources: [wikipedia:Chariot]
  - id: k-iron
    title: Iron for the many
    date: c. 750 BCE
    lane: hallstatt
    image: w-iron-sword
    text: Iron, found almost everywhere, armed far larger armies than scarce bronze ever could.
    cause: The collapse of the Bronze Age trade networks around 1200 BCE cut the long routes that supplied tin, while iron ore lay nearly everywhere.
    consequence: Cheap iron let kings arm ordinary men by the thousand. Assyria built the first great iron-armed army, and Celtic smiths spread iron across Europe.
    sources: [wikipedia:Iron_Age]
  - id: k-crossbow
    title: The crossbow
    date: c. 400 BCE
    lane: zhou-eastern
    image: w-crossbow
    text: A bronze trigger let a peasant conscript shoot with deadly force after a few days' training.
    cause: The Warring States needed to turn huge numbers of farmers into soldiers quickly, and a weapon that did not need years of practice.
    consequence: Massed crossbows decided Chinese wars for a thousand years and helped hold back steppe cavalry. In Europe the crossbow returned in the Middle Ages, and the Church tried to ban it against Christians.
    sources: [wikipedia:Crossbow]
  - id: k-stirrup
    title: The stirrup
    date: c. 322 CE
    lane: eastern-jin
    image: w-stirrup
    text: A footrest for riders gave cavalry a firm seat for the lance, the sword and the bow.
    cause: Armoured horsemen in north China and on the steppe needed a stable seat; the first paired stirrups appear in Chinese tombs of the early 4th century.
    consequence: Carried west by the Avars by the 600s, it helped make heavy cavalry the masters of the battlefield, from Persian cataphracts to the European knight.
    sources: [wikipedia:Stirrup]
  - id: k-greek-fire
    title: Greek fire
    date: 672 CE
    lane: eastern-roman
    image: w-greek-fire
    text: A secret liquid fire that burned on water saved Constantinople from the Arab fleets.
    cause: Arab navies were besieging Constantinople; tradition says a refugee engineer from Syria, Kallinikos, brought the recipe.
    consequence: Byzantium broke the great sieges of 674–678 and 717–718 and survived for another seven centuries. The secret was kept so well that the formula is still unknown.
    sources: [wikipedia:Greek_fire]
  - id: k-gunpowder
    title: Gunpowder
    date: 1044 CE
    lane: song
    image: w-fire-lance
    text: Chinese alchemists' "fire drug" became fire lances, bombs and, in time, guns.
    cause: Daoist alchemists searching for elixirs mixed saltpetre, sulphur and charcoal. The Song, under constant threat from the north, turned it into weapons and wrote down the formula in 1044.
    consequence: Within three centuries gunpowder weapons had spread across Eurasia, and the gun ended the age of castles and armoured knights.
    sources: [wikipedia:Gunpowder]
  - id: k-cannon
    title: The siege cannon
    date: 1453 CE
    lane: ottoman
    image: w-bombard
    text: Giant bronze bombards broke walls that had stood for a thousand years.
    cause: Mehmed II hired the engineer Orban to cast guns big enough to breach the Theodosian walls of Constantinople.
    consequence: High medieval walls became useless. Rulers who could pay for siege guns crushed those who couldn't, helping build the great gunpowder empires of the Ottomans, Safavids and Mughals.
    sources: [wikipedia:Fall_of_Constantinople]
  - id: k-star-fort
    title: The star fort
    date: c. 1530 CE
    lane: italian-cities
    image: w-star-fort
    text: Low, thick, angled walls shrugged off cannon and covered every approach with fire.
    cause: Italian engineers answered the siege cannon with earth-backed walls built low and set into star-shaped bastions.
    consequence: Sieges grew long and ruinously expensive again; armies grew huge to conduct them, and only states with large treasuries could fight.
    sources: [wikipedia:Bastion_fort]
  - id: k-drill
    title: Musket and drill
    date: 1600 CE
    lane: dutch
    image: w-musket-drill
    text: Maurice of Nassau drilled musketeers to fire in volleys, rank after rank, in unbroken rhythm.
    cause: Muskets were slow to reload. Fighting the Spanish, the Dutch needed a way to keep up steady fire, and took their model from Roman drill.
    consequence: Disciplined standing armies became the pattern for every European state, and for the colonial armies that later conquered much of the world.
    sources: [wikipedia:Maurice_of_Orange]
  - id: k-machine-gun
    title: The machine gun
    date: 1884 CE
    lane: united-kingdom
    image: w-maxim
    text: Hiram Maxim's gun fired 600 rounds a minute, worked by the force of its own recoil.
    cause: Industrial engineering applied to firearms, and empires eager for an edge in colonial wars.
    consequence: It let small colonial forces slaughter African armies, and in 1914–18 it made frontal attack suicidal and trapped whole armies in trenches.
    sources: [wikipedia:Maxim_gun]
  - id: k-air
    title: War in the air
    date: 1917 CE
    lane: germany
    image: w-fokker
    text: Within fifteen years of the first flight, aircraft scouted, fought each other and bombed cities.
    cause: Generals needed to see over the trenches, then to stop the enemy seeing, and finally to strike far behind the front.
    consequence: By the Second World War bombers could reach cities hundreds of miles away; air power decided battles on land and sea, and civilians became targets.
    sources: [wikipedia:Aerial_warfare]
  - id: k-nuclear
    title: The atomic bomb
    date: 1945 CE
    lane: united-states
    image: w-trinity
    text: One bomb could now destroy a city; within years, thousands could end civilisation.
    cause: Fear that Nazi Germany would build one first drove the Manhattan Project, which tested its first bomb in New Mexico in July 1945.
    consequence: Hiroshima and Nagasaki ended the Pacific war. Nuclear deterrence then kept the superpowers from fighting each other directly throughout the Cold War, under the threat of mutual destruction.
    sources: [wikipedia:Nuclear_weapon]

notes:
  sargon:
    cause: Sargon, a cupbearer turned king of Kish, set out to rule all the quarreling Sumerian city-states and the trade routes that fed them.
    consequence: The first empire, ruling peoples of different languages from one capital. Its model of a king of the four corners of the world was copied for two thousand years.
  kadesh:
    cause: Ramesses II marched north to take back Kadesh and southern Syria from the Hittite king Muwatalli, the great rival for the Levant.
    consequence: Both sides claimed victory. Sixteen years later they made the first peace treaty whose text survives, and agreed to defend each other.
  marathon:
    cause: Darius sent an expedition to punish Athens for helping the Ionian Greeks revolt against Persia.
    consequence: Athens' citizen hoplites beat the invaders on their own. The victory gave the young democracy its founding legend and the confidence to build a navy.
  thermopylae:
    cause: Xerxes invaded Greece with a vast army; a small force under Leonidas of Sparta held the narrow pass to buy time for the Greek fleet.
    consequence: The defenders were wiped out, but their stand became a symbol of resistance, and weeks later the Greek fleet destroyed the Persian navy at Salamis.
  gaugamela:
    cause: Darius III gathered the full strength of Persia to stop Alexander, who had already taken Asia Minor, Syria and Egypt.
    consequence: Alexander broke the Persian army and Darius fled. The capitals Babylon, Susa and Persepolis fell, and the Persian Empire passed to Macedon.
  kalinga:
    cause: Ashoka set out to conquer Kalinga, a rich coastal kingdom that blocked the Mauryan empire's control of the eastern sea routes.
    consequence: About 100,000 were killed. Ashoka, horrified, turned to Buddhism and to ruling by moral law, and had his remorse carved on rocks across India.
  hannibal-alps:
    cause: Hannibal decided to fight Rome in Italy itself, hoping that Rome's allies would desert it if he won there.
    consequence: He won at Trebia, Trasimene and Cannae but could not take Rome. The war ended in Carthage's defeat at Zama, and Rome learned to fight wars of attrition.
  carrhae:
    cause: Crassus, the richest man in Rome, invaded Parthia to win military glory equal to his rivals Caesar and Pompey.
    consequence: Parthian horse archers destroyed his legions and Crassus was killed. The Euphrates became the frontier between Rome and Persia for centuries.
  teutoburg:
    cause: Arminius, a Germanic chief who had served in the Roman army, led three legions into an ambush to stop Rome turning Germania into a province.
    consequence: Three legions were destroyed. Rome gave up conquering Germany and made the Rhine its frontier, so Latin never took root east of it.
  sack-410:
    cause: Alaric's Visigoths had been refused land and payment by the Western Roman government, and he took Rome to force its hand.
    consequence: The first sack of Rome by a foreign enemy in eight centuries shocked the Mediterranean; Augustine wrote the City of God in reply. The Visigoths later settled in Gaul and Spain.
  karbala:
    cause: Husayn, grandson of the Prophet, refused to accept Yazid as caliph and set out for Kufa, where supporters had promised to rise for him.
    consequence: Husayn and his family were killed. His death became the founding tragedy of Shia Islam, mourned every year at Ashura, and deepened the divide between Sunni and Shia.
  tariq:
    cause: Umayyad forces in North Africa crossed into Visigothic Spain, which was divided by a disputed succession.
    consequence: King Roderic was killed and most of Iberia was conquered within a decade. Al-Andalus became a centre of learning for eight centuries.
  hastings:
    cause: William of Normandy claimed the English throne had been promised to him, and invaded when Harold Godwinson was crowned instead.
    consequence: Harold was killed and William became king. A French-speaking nobility replaced the English one, the English language changed for good, and England was tied to France for four centuries.
  manzikert:
    cause: The emperor Romanos IV marched east to stop Seljuk raids into Armenia and Anatolia.
    consequence: He was defeated and captured. Turkish tribes poured into Anatolia, which became Turkey, and Byzantium's appeal for help led to the First Crusade.
  jerusalem-1099:
    cause: The First Crusade was called to free Jerusalem and the holy places from Muslim rule.
    consequence: The crusaders took the city and massacred its Muslim and Jewish people. They founded Latin states in the Levant that lasted almost two hundred years.
  saladin:
    cause: Saladin had united Egypt and Syria and called for holy war to take back Jerusalem from the crusaders.
    consequence: After destroying the crusader army at Hattin, he took Jerusalem with little bloodshed. The Third Crusade failed to win it back.
  baghdad-1258:
    cause: Hülegü, Genghis Khan's grandson, demanded the caliph's submission; the caliph refused.
    consequence: Baghdad was sacked, perhaps hundreds of thousands killed, its libraries thrown into the Tigris. The Abbasid caliphate in Baghdad ended, and the centre of the Islamic world moved to Cairo.
  ain-jalut:
    cause: After sacking Baghdad, the Mongols demanded the surrender of Mamluk Egypt, the last great Muslim power.
    consequence: The Mamluks won, the first time a Mongol army was decisively beaten in battle. It saved Egypt and the holy cities and set the western limit of the Mongol advance.
  constantinople-1453:
    cause: Mehmed II wanted the city that blocked his empire's heart and the prestige of Rome's last capital.
    consequence: The Byzantine Empire ended after 1,100 years. Constantinople became the Ottoman capital, and Greek scholars carried ancient texts west to Italy.
  cortes:
    cause: Cortés, with Tlaxcalan and other allies who resented Aztec rule, besieged Tenochtitlan after being driven out of the city in 1520.
    consequence: The city fell after smallpox had killed much of its people. The Aztec empire became New Spain, and Mexico City was built on its ruins.
  cajamarca:
    cause: Pizarro, with fewer than 200 men, met the Inca emperor Atahualpa just after he had won a civil war against his brother.
    consequence: Pizarro seized Atahualpa, took a room of gold as ransom and killed him anyway. The Inca empire, already divided and struck by smallpox, fell to Spain.
  panipat-1526:
    cause: Babur, a Timurid prince driven out of Central Asia, invaded India to win a new kingdom from the Lodi sultan of Delhi.
    consequence: His cannon and cavalry won against a much larger army. He founded the Mughal Empire, which ruled most of India for two centuries.
  sekigahara:
    cause: After Toyotomi Hideyoshi died, his regents split into two camps over who would rule Japan in his young son's name.
    consequence: Tokugawa Ieyasu won and became shogun in 1603. His family ruled a peaceful, closed Japan for 250 years.
  plassey:
    cause: The Nawab of Bengal attacked the British East India Company for fortifying Calcutta; Robert Clive bribed his commander to change sides.
    consequence: The Company took control of Bengal, the richest province of India, and used its revenues to conquer much of the rest of the subcontinent.
  waterloo:
    cause: Napoleon escaped from exile and retook France, and the allied powers marched to remove him again.
    consequence: Napoleon was defeated by Wellington and Blücher and exiled for good. The Congress of Vienna's settlement held Europe in balance until 1914.
  haitian-revolution:
    cause: Enslaved Africans on the richest sugar colony in the world rose against their masters, inspired in part by the French Revolution's talk of rights.
    consequence: Haiti became the first state founded by formerly enslaved people, in 1804. Its example terrified slave owners across the Americas, and France demanded a crushing indemnity for its losses.
  opium-war:
    cause: China seized and destroyed British opium at Canton to stop the drug trade; Britain went to war to protect it.
    consequence: China ceded Hong Kong and opened ports to foreign trade. The first of the unequal treaties began what China calls its century of humiliation.
  rebellion-1857:
    cause: Indian soldiers of the East India Company rose over new cartridges rumoured to be greased with cow and pig fat, on top of deep anger at annexations and reforms.
    consequence: The rising was crushed with great brutality. The British Crown took over India from the Company, and the last Mughal emperor was exiled.
  adwa:
    cause: Italy claimed that a treaty had made Ethiopia its protectorate; Emperor Menelik II rejected the claim and Italy invaded.
    consequence: Menelik's army destroyed the Italian force. Ethiopia stayed independent through the Scramble for Africa and became a symbol of African resistance.
  tsushima:
    cause: Japan and Russia were fighting over Manchuria and Korea; Russia's Baltic fleet sailed halfway round the world to relieve Port Arthur.
    consequence: Japan's navy sank almost the entire Russian fleet. For the first time in modern history an Asian power had defeated a European one, and revolution broke out in Russia.
  sarajevo:
    cause: A Bosnian Serb nationalist shot Archduke Franz Ferdinand to strike at Austrian rule over the South Slavs.
    consequence: Austria's ultimatum to Serbia set off the alliances and mobilisation plans of the great powers, and within six weeks Europe was at war.
  invasion-poland:
    cause: Hitler wanted living space in the east and the return of land lost in 1919; a secret pact with Stalin had divided Poland between them.
    consequence: Britain and France declared war on Germany two days later. Poland was crushed between Germany and the Soviet Union, and the Second World War in Europe began.
  barbarossa:
    cause: Hitler aimed to destroy the Soviet Union, seize its land and grain for German settlers, and exterminate its Jews and communists.
    consequence: The largest invasion in history stalled before Moscow. The war in the east, the bloodiest front of the war, eventually broke the German army.
  stalingrad:
    cause: Germany drove for the Caucasus oil fields and the city bearing Stalin's name on the Volga.
    consequence: A whole German army was encircled and destroyed. The tide of the war in Europe turned towards the Soviet Union.
  hiroshima:
    cause: The United States wanted to force Japan's surrender without an invasion, and to end the war on its own terms.
    consequence: Over 200,000 people died in the two cities. Japan surrendered, and the world entered the nuclear age.
  vietnam-war:
    cause: The United States fought to stop communist North Vietnam and the Viet Cong reunifying the country.
    consequence: After 58,000 American and millions of Vietnamese deaths, the US withdrew; Saigon fell in 1975 and Vietnam was reunified under communist rule.
  berlin-conference:
    cause: European powers wanted rules to divide Africa among themselves without going to war with each other.
    consequence: Africa was partitioned on maps in Berlin, with no African present. Within thirty years almost the whole continent was under European rule.
