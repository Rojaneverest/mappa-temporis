# The War & conquest lens (decision 59): drawn only while the lens is on.
# conflicts — bands across the lanes involved; arrows — conquests and invasions the chart doesn't
# already draw; images — the lens's own pictures; cards — turning points in how war was fought;
# notes — why a war or battle was fought and what it changed, for events already on the chart.
# Claude drafts, Rojan reviews (decision 6). Every entry is sourced.
lens: war

conflicts:
  - id: c-egypt-hittite
    name: Egypt against the Hittites
    span: 1300 – 1259 BCE
    lanes: [egypt-new-kingdom, hittites]
    prominence: 2
    sides: New Kingdom Egypt against the Hittite Empire
    cause: The two great powers of the Bronze Age wanted the rich trading cities of Syria and the Levant, which sat on the border between their empires and changed sides as each grew stronger.
    consequence: Neither could win. After the stalemate at Kadesh they signed the oldest peace treaty whose text survives, fixed a border, and kept the peace for a generation, until both were shaken by the Bronze Age collapse.
    sources: [wikipedia:Egyptian–Hittite_peace_treaty]
  - id: c-assyrian-conquests
    name: Assyria's wars of conquest
    span: 911 – 612 BCE
    lanes: [neo-assyria, judah, phoenicia, neo-babylonian, egypt-third-intermediate, elam]
    prominence: 2
    sides: The Neo-Assyrian Empire against its neighbours
    cause: Assyrian kings saw conquest as a duty to their god Ashur, and their economy ran on tribute, plunder and deported labour; a professional standing army with iron weapons and siege engines made expansion possible.
    consequence: Assyria built the first empire to span the whole Near East, moving whole peoples across it. Its brutality left it hated, and when it fell in 612 BCE its methods of governing an empire passed to Babylon and Persia.
    sources: [wikipedia:Neo-Assyrian_Empire]
  - id: c-greco-persian
    name: The Greco-Persian Wars
    span: 499 – 449 BCE
    lanes: [achaemenid, athens, sparta, greek-poleis]
    prominence: 1
    sides: The Persian Empire against an alliance of Greek city-states
    cause: Greek cities in Ionia revolted against Persian rule with help from Athens. Darius, and then Xerxes, set out to punish Athens and bring the Aegean under Persian control.
    consequence: The small Greek states held off the largest empire on earth. Athens turned its leadership of the alliance into a naval empire whose tribute paid for the Parthenon, and whose growing power led straight to war with Sparta.
    sources: [wikipedia:Greco-Persian_Wars]
  - id: c-peloponnesian
    name: The Peloponnesian War
    span: 431 – 404 BCE
    lanes: [athens, sparta]
    prominence: 1
    sides: Athens and its empire against Sparta and the Peloponnesian League
    cause: "Thucydides put it in one line: the growth of Athenian power and the fear this caused in Sparta. Quarrels over Corinth's colonies and Megara's trade gave the spark."
    consequence: Athens lost its fleet, its empire and for a time its democracy. The Greek city-states were left exhausted and divided, and within seventy years Macedon had mastered them all.
    sources: [wikipedia:Peloponnesian_War]
  - id: c-alexander
    name: Alexander's conquests
    span: 334 – 323 BCE
    lanes: [alexander-empire, achaemenid, macedon]
    prominence: 1
    sides: Macedon and the Greeks against the Persian Empire
    cause: Philip II had planned a war of revenge on Persia for Xerxes' invasion, to unite the Greeks behind Macedon. His son Alexander carried it out, driven by ambition, plunder and the wish to outdo the heroes of Homer.
    consequence: The Persian Empire fell in four years. Greek became the language of power from Egypt to Afghanistan, and Alexander's generals split his empire into kingdoms whose cities spread Greek culture for three centuries.
    sources: [wikipedia:Wars_of_Alexander_the_Great]
  - id: c-warring-states
    name: The Warring States
    span: 475 – 221 BCE
    lanes: [zhou-eastern, qin-state, chu, qin]
    prominence: 1
    sides: Seven kingdoms fighting for mastery of China
    cause: The Zhou kings had lost all real power, and the seven strongest states fought to replace them. Iron, mass conscript infantry, crossbows and cavalry made each war bigger than the last.
    consequence: Qin, the most ruthlessly organised of the seven, conquered the rest in 221 BCE and created the first unified Chinese empire, with one script, one currency and one law.
    sources: [wikipedia:Warring_States_period]
  - id: c-punic
    name: The Punic Wars
    span: 264 – 146 BCE
    lanes: [roman-republic, carthage, numidia]
    prominence: 1
    sides: Rome against Carthage
    cause: Rome and Carthage collided over Sicily, which lay between them. Each victory gave Rome new frontiers to defend, and Carthage's revival after each defeat convinced Rome's senators that it had to be destroyed.
    consequence: Carthage was razed in 146 BCE. Rome became master of the western Mediterranean, gained its first overseas provinces, and turned east against the Greek kingdoms with the navy and armies it had built.
    sources: [wikipedia:Punic_Wars]
  - id: c-han-xiongnu
    name: The Han–Xiongnu wars
    span: 133 BCE – 89 CE
    lanes: [han, xiongnu]
    prominence: 1
    sides: Han China against the Xiongnu confederation of the steppe
    cause: The Xiongnu raided northern China and forced the early Han to pay tribute and send princesses as brides. Emperor Wu ended this humiliating peace and sent huge cavalry armies onto the steppe.
    consequence: The Han won the Gansu corridor and the oases of the Tarim Basin, opening the Silk Road to the west. The Xiongnu split; some of their descendants may later have reached Europe as the Huns.
    sources: [wikipedia:Han–Xiongnu_War]
  - id: c-rome-persia
    name: Rome against Persia
    span: 54 BCE – 628 CE
    lanes: [roman-republic, roman-empire, eastern-roman, parthian, sasanian, armenia]
    prominence: 2
    sides: Rome and Byzantium against Parthian and then Sasanian Persia
    cause: The two greatest empires of western Asia met along the Euphrates. Each wanted Armenia and the rich cities of Mesopotamia, and each claimed to be the heir of Alexander or of the ancient Persian kings.
    consequence: Seven centuries of wars changed the border little. The last and greatest of them, from 602 to 628, exhausted both empires just as the armies of Islam came out of Arabia.
    sources: [wikipedia:Roman–Persian_Wars]
  - id: c-three-kingdoms
    name: The Three Kingdoms wars
    span: 184 – 280 CE
    lanes: [han, cao-wei, shu-han, eastern-wu]
    prominence: 2
    sides: Warlords of the falling Han, then Wei, Shu and Wu
    cause: Court intrigue, famine and the Yellow Turban rebellion broke Han authority. Generals raised private armies, and the strongest carved China into three rival states.
    consequence: China's registered population fell by more than half. Jin reunified the country in 280, but only briefly; centuries of division between north and south followed, and the era became China's great legend of loyalty and cunning.
    sources: [wikipedia:Three_Kingdoms]
  - id: c-fall-of-west
    name: The fall of the Western Empire
    span: 376 – 476 CE
    lanes: [western-roman, roman-empire, germanic-peoples, visigoths, huns, vandal-kingdom]
    prominence: 1
    sides: The Western Roman Empire against Goths, Vandals, Huns and others
    cause: The Huns drove the Goths across the Danube into Roman land. Rome failed either to defeat them or to settle them peacefully, and its civil wars, fiscal crisis and dependence on barbarian soldiers let other peoples follow.
    consequence: The Western Empire was replaced by Germanic kingdoms, while the Eastern Empire survived for another thousand years. Latin Christianity, Roman law and the Roman church outlived the state that made them.
    sources: [wikipedia:Fall_of_the_Western_Roman_Empire]
  - id: c-arab-conquests
    name: The Arab conquests
    span: 632 – 750 CE
    lanes: [rashidun, umayyad, sasanian, eastern-roman, visigoths]
    prominence: 1
    sides: The early caliphate against Byzantium, Persia and Visigothic Spain
    cause: Islam had united the tribes of Arabia under one leader for the first time. Its neighbours, Byzantium and Persia, were exhausted by their own long war, and conquest brought faith, land and plunder together.
    consequence: In a century the caliphate stretched from Spain to the Indus. Persia fell entirely and Byzantium lost Syria and Egypt; Arabic and Islam spread across a world that still largely speaks and prays in them.
    sources: [wikipedia:Early_Muslim_conquests]
  - id: c-an-lushan
    name: The An Lushan rebellion
    span: 755 – 763 CE
    lanes: [tang]
    prominence: 2
    sides: The Tang dynasty against its own frontier general An Lushan
    cause: The Tang had placed huge armies on the frontier under a few generals. An Lushan, who commanded three of them, fell out with the chief minister and marched on the capitals.
    consequence: Millions died and the Tang never regained full control of its provinces, which passed to military governors. The court grew wary of the outside world, and the age of Tang expansion ended.
    sources: [wikipedia:An_Lushan_rebellion]
  - id: c-vikings
    name: The Viking raids
    span: 793 – 1066 CE
    lanes: [vikings, england, france, gaelic-ireland, rus]
    prominence: 2
    sides: Norse raiders and settlers against the kingdoms of the north and west
    cause: Rich, unguarded monasteries and towns lay a few days' sail from Scandinavia, and Norse longships could reach them by sea and river. Land shortage at home and the prestige of plunder drew young men abroad.
    consequence: Raiders became settlers and rulers, in the Danelaw, Normandy, Iceland and Kievan Rus. Their trade routes linked Baghdad to Dublin, and their descendants, the Normans, conquered England in 1066.
    sources: [wikipedia:Viking_expansion]
  - id: c-reconquista
    name: The Reconquista
    span: 718 – 1492 CE
    lanes: [al-andalus, castile, portugal, spain]
    prominence: 2
    sides: The Christian kingdoms of Iberia against al-Andalus
    cause: Small Christian kingdoms in the northern mountains pushed south over centuries, for land, for the Church and for the glory of their kings, helped whenever al-Andalus split into rival states.
    consequence: Granada, the last Muslim state, fell in 1492. Spain was united under Catholic monarchs who expelled its Jews and later its Muslims, and turned the same crusading energy across the Atlantic.
    sources: [wikipedia:Reconquista]
  - id: c-crusades
    name: The Crusades
    span: 1095 – 1291 CE
    lanes: [papal-states, crusader-states, eastern-roman, seljuks, fatimids, ayyubids, mamluks]
    prominence: 1
    sides: Western Christian armies against the Muslim powers of the Levant
    cause: Byzantium asked the Pope for help against the Seljuk Turks. Urban II called instead for an armed pilgrimage to free Jerusalem, promising forgiveness of sins; land, adventure and Italian trade drew many more.
    consequence: The crusader states were gone by 1291. The Fourth Crusade's sack of Constantinople fatally weakened Byzantium, Italian cities grew rich on eastern trade, and the memory of the Crusades still shapes how Christians and Muslims see each other.
    sources: [wikipedia:Crusades]
  - id: c-mongol
    name: The Mongol conquests
    span: 1206 – 1294 CE
    lanes: [mongol-empire, khwarazm, jin-jurchen, song, abbasid, rus, golden-horde, ilkhanate, yuan]
    prominence: 1
    sides: The Mongol Empire against most of Eurasia
    cause: Genghis Khan united the feuding tribes of the steppe. To hold his followers together he had to keep them winning and rich, and an army of disciplined horse archers made almost any target possible.
    consequence: The largest land empire in history, built at the cost of tens of millions of lives. It joined China to Persia and Russia, carried trade, ideas and probably the Black Death across Eurasia, and destroyed Baghdad's caliphate.
    sources: [wikipedia:Mongol_invasions_and_conquests]
  - id: c-hundred-years
    name: The Hundred Years' War
    span: 1337 – 1453 CE
    lanes: [england, france]
    prominence: 1
    sides: The kings of England against the kings of France
    cause: English kings held land in France as vassals of the French king, and Edward III claimed the French crown itself through his mother.
    consequence: England lost everything in France but Calais. Both kingdoms came out with stronger kings, standing armies and a sharper sense of national identity, and the longbow and the cannon had changed how battles were won.
    sources: [wikipedia:Hundred_Years'_War]
  - id: c-ottoman-rise
    name: The Ottoman conquests
    span: 1354 – 1529 CE
    lanes: [ottoman, eastern-roman, bulgaria, mamluks, hungary, habsburg-austria]
    prominence: 2
    sides: The Ottoman Empire against Byzantium, the Balkans, Mamluk Egypt and Hungary
    cause: A frontier state of Turkish warriors grew by holy war and by absorbing the lands of its weaker neighbours, with a disciplined slave infantry, the Janissaries, and the best cannon of the age.
    consequence: Constantinople fell in 1453 and the Ottomans ruled from Hungary to Mecca. Europe's eastern trade routes ran through their hands, one reason western sailors looked for a way round Africa.
    sources: [wikipedia:Rise_of_the_Ottoman_Empire]
  - id: c-americas-conquest
    name: The Spanish conquest of the Americas
    span: 1519 – 1572 CE
    lanes: [aztec, inca, new-spain, peru, spain, maya]
    prominence: 1
    sides: Spanish conquistadors and their native allies against the Aztec and Inca empires
    cause: Conquistadors came for gold, land and titles, and in the name of converting souls. Steel, horses and guns mattered, but what decided the wars were native allies who hated their overlords, and epidemics.
    consequence: Two great empires were destroyed and smallpox and other diseases killed most of the population of the Americas. Silver from Mexico and Peru flooded into Europe and China and paid for a global economy.
    sources: [wikipedia:Spanish_conquest_of_the_Aztec_Empire, wikipedia:Spanish_conquest_of_the_Inca_Empire]
  - id: c-imjin
    name: The Imjin War
    span: 1592 – 1598 CE
    lanes: [joseon, shogunate, ming]
    prominence: 2
    sides: Japan against Joseon Korea and Ming China
    cause: Toyotomi Hideyoshi, having just unified Japan, wanted to conquer Ming China and keep his warlords busy abroad. Korea refused to let his army pass.
    consequence: Korea was devastated, but Admiral Yi Sun-sin's navy cut the Japanese supply lines. The war drained the Ming treasury, and after Hideyoshi's death Japan withdrew and, under the Tokugawa, turned inwards.
    sources: [wikipedia:Japanese_invasions_of_Korea_(1592–1598)]
  - id: c-thirty-years
    name: The Thirty Years' War
    span: 1618 – 1648 CE
    lanes: [holy-roman-empire, france, scandinavia, spain, dutch, habsburg-austria]
    prominence: 1
    sides: Catholic Habsburgs against Protestant princes, Sweden and France
    cause: It began as a revolt of Protestant Bohemia against its Catholic Habsburg king and grew into a struggle between France and the Habsburgs for mastery of Europe.
    consequence: Perhaps a third of the people of Germany died. The Peace of Westphalia made each ruler sovereign within his own lands, a principle the modern system of states still rests on.
    sources: [wikipedia:Thirty_Years'_War]
  - id: c-manchu-conquest
    name: The Manchu conquest of China
    span: 1618 – 1683 CE
    lanes: [ming, qing]
    prominence: 2
    sides: The Manchu Qing against the Ming dynasty and its loyalists
    cause: The Manchus had built a strong state north of the Great Wall while the Ming collapsed under famine, debt and peasant rebellion. When rebels took Beijing, a Ming general let the Manchus in to defeat them.
    consequence: The Qing ruled China until 1912 and doubled its territory, taking Taiwan, Mongolia, Xinjiang and Tibet. Han Chinese men were ordered to wear the Manchu queue as a sign of submission.
    sources: [wikipedia:Transition_from_Ming_to_Qing]
  - id: c-seven-years
    name: The Seven Years' War
    span: 1756 – 1763 CE
    lanes: [united-kingdom, france, habsburg-austria, spain, british-america, muscovy]
    prominence: 2
    sides: Britain and Prussia against France, Austria, Russia and Spain
    cause: Britain and France competed for North America, India and the sugar islands, while Austria wanted back the province of Silesia that Prussia had seized.
    consequence: Britain won Canada and the upper hand in India and became the leading global power. Its war debts led it to tax the American colonies, which led to revolution; France's debts helped bring on its own.
    sources: [wikipedia:Seven_Years'_War]
  - id: c-american-revolution
    name: The American Revolutionary War
    span: 1775 – 1783 CE
    lanes: [british-america, united-states, united-kingdom, france]
    prominence: 1
    sides: Thirteen American colonies, with France, against Britain
    cause: Colonists rejected taxes laid on them by a Parliament in which they had no vote, and Britain's attempts to enforce its authority by force turned protest into war.
    consequence: The United States became independent, a republic built on written principles of rights and self-government. Its example, and France's ruinous cost of joining in, helped set off revolutions in France and Latin America.
    sources: [wikipedia:American_Revolutionary_War]
  - id: c-napoleonic
    name: The French Revolutionary and Napoleonic Wars
    span: 1792 – 1815 CE
    lanes: [france, united-kingdom, habsburg-austria, muscovy, spain, holy-roman-empire]
    prominence: 1
    sides: Revolutionary and Napoleonic France against coalitions of European monarchies
    cause: Europe's kings tried to crush the French Revolution before it spread; France fought back with mass conscript armies and carried the revolution abroad. Napoleon then turned defence into conquest.
    consequence: The Holy Roman Empire ended and nationalism spread across Europe. Napoleon's legal code outlived him, Spain's hold on its American colonies broke, and the Congress of Vienna set a balance of power that lasted a century.
    sources: [wikipedia:Napoleonic_Wars]
  - id: c-latin-independence
    name: The wars of Spanish American independence
    span: 1808 – 1826 CE
    lanes: [new-spain, peru, argentina, spain]
    prominence: 2
    sides: Patriot armies of Spanish America against the Spanish Crown
    cause: When Napoleon seized Spain in 1808, royal authority in the colonies collapsed. American-born elites, long kept from power by Spaniards, chose to govern themselves.
    consequence: Spain's empire on the mainland was gone by 1826, replaced by republics from Mexico to Argentina. Power stayed largely with the creole elite and the army, and many of the new states were ruled by generals for decades.
    sources: [wikipedia:Spanish_American_wars_of_independence]
  - id: c-opium
    name: The Opium Wars
    span: 1839 – 1860 CE
    lanes: [qing, united-kingdom]
    prominence: 1
    sides: Britain, later with France, against Qing China
    cause: Britain bought vast amounts of Chinese tea and paid for it with opium smuggled from India. When China destroyed the opium and banned the trade, Britain went to war to force it open.
    consequence: China ceded Hong Kong, opened treaty ports and paid indemnities. The "unequal treaties" began what China still calls its century of humiliation, and badly weakened the Qing.
    sources: [wikipedia:Opium_Wars]
  - id: c-taiping
    name: The Taiping Rebellion
    span: 1850 – 1864 CE
    lanes: [qing]
    prominence: 1
    sides: The Taiping Heavenly Kingdom against the Qing dynasty
    cause: Famine, overpopulation and resentment of the Manchu dynasty met a failed examination candidate, Hong Xiuquan, who believed he was the younger brother of Jesus and promised a kingdom of equality.
    consequence: Perhaps 20 to 30 million people died, making it one of the deadliest wars in history. The Qing survived only by relying on provincial armies, which hollowed out central power.
    sources: [wikipedia:Taiping_Rebellion]
  - id: c-us-civil-war
    name: The American Civil War
    span: 1861 – 1865 CE
    lanes: [united-states]
    prominence: 1
    sides: The Union against the slave-holding Confederacy
    cause: The question of whether slavery would spread into the new western territories. When Lincoln was elected on a platform against its spread, eleven southern states seceded to protect it.
    consequence: About 620,000 soldiers died. The Union was preserved and slavery abolished, and the industrial North set the course of the country, though the promise of equal rights for freed people was largely abandoned after 1877.
    sources: [wikipedia:American_Civil_War]
  - id: c-scramble
    name: The conquest of Africa
    span: 1881 – 1914 CE
    lanes: [colonial-africa, ethiopia, zulu, ashanti, dahomey, ife-benin, sudan]
    prominence: 1
    sides: European powers against African states and peoples
    cause: Industrial Europe wanted raw materials, markets and prestige, and rivalry between the powers turned into a race. Quinine, steamships, railways and the machine gun made conquest cheap.
    consequence: By 1914 all of Africa except Ethiopia and Liberia was ruled from Europe. Colonial borders drawn with little regard for the peoples inside them are still, almost unchanged, the borders of Africa today.
    sources: [wikipedia:Scramble_for_Africa]
  - id: c-ww1
    name: The First World War
    span: 1914 – 1918 CE
    lanes: [habsburg-austria, germany, france, united-kingdom, muscovy, ottoman, italy, united-states, empire-japan]
    prominence: 1
    sides: The Allies against the Central Powers
    cause: The murder of an Austrian archduke set off a chain of alliances, mobilisation plans and imperial rivalries that no government was willing to stop.
    consequence: About 20 million died. The German, Austrian, Russian and Ottoman empires fell, Russia turned communist, the Middle East was divided between Britain and France, and the peace left grievances that fed the next war.
    sources: [wikipedia:World_War_I]
  - id: c-ww2
    name: The Second World War
    span: 1939 – 1945 CE
    lanes: [germany, muscovy, united-kingdom, france, united-states, empire-japan, roc, italy, poland]
    prominence: 1
    sides: The Allies against Germany, Italy and Japan
    cause: Nazi Germany set out to overturn the post-1918 settlement and conquer living space in the east, and imperial Japan to dominate Asia; the Great Depression had brought both regimes to power or emboldened them.
    consequence: Some 70 to 85 million died, including six million Jews in the Holocaust. Europe was divided, the United States and the Soviet Union became superpowers, the United Nations was founded, and the European empires began to fall.
    sources: [wikipedia:World_War_II]
  - id: c-cold-war
    name: The Cold War
    span: 1947 – 1991 CE
    lanes: [united-states, muscovy, prc, south-korea, dai-viet, afghanistan, cuba]
    prominence: 1
    sides: The United States and its allies against the Soviet Union and its allies
    cause: The two victors of 1945 had opposed systems, capitalist democracy and communist one-party rule, and each saw the other's influence in Europe and beyond as a threat.
    consequence: The superpowers never fought directly, but nuclear arms races and proxy wars in Korea, Vietnam and Afghanistan killed millions. It ended with the collapse of the Soviet Union in 1991.
    sources: [wikipedia:Cold_War]
  - id: c-korean
    name: The Korean War
    span: 1950 – 1953 CE
    lanes: [south-korea, prc, united-states]
    prominence: 2
    sides: North Korea and China against South Korea and United Nations forces
    cause: Korea had been divided at the end of the Second World War. North Korea invaded the South to reunify it under communist rule, with Stalin's approval.
    consequence: About three million died and the front ended almost where it began. Korea remains divided, and the war turned the Cold War into an arms race fought around the world.
    sources: [wikipedia:Korean_War]
  - id: c-vietnam
    name: The Vietnam wars
    span: 1946 – 1975 CE
    lanes: [dai-viet, france, united-states]
    prominence: 1
    sides: The Viet Minh and North Vietnam against France, then South Vietnam and the United States
    cause: Vietnamese nationalists fought first to end French colonial rule. After the country was divided in 1954, the United States backed the South to stop communism spreading in Asia.
    consequence: Vietnam was reunified under communist rule in 1975. Millions of Vietnamese died, Cambodia fell into the Khmer Rouge terror, and the United States learnt the limits of its power.
    sources: [wikipedia:Vietnam_War]

