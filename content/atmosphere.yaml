# Atmosphere: faint engravings printed into the open paper of each era × region (decisions 30–31).
# Decoration only: no prominence, never clickable, fading out before the century zoom.
# The layout picks the emptiest spot inside `span` within the region; `size` is how much room it wants.
# `crop` keeps part of the scan ([left, top, right, bottom] as fractions) to drop plate frames and captions;
# every engraving is also feathered at its edges. Credits land in docs/CREDITS.md via `pnpm images`.
