# A narrated camera flight. Each step flies to a target (lane, event, image or thread) and shows its text.
id: axial-age
title: The Axial Age
subtitle: Six centuries, four corners of Eurasia, one question — how should we live?
sheet: classical-world
steps:
  - target: greek-poleis
    zoom: 0.9
    text: >-
      Between roughly 800 and 200 BCE, thinkers in China, India, Persia, the Levant and Greece —
      mostly unaware of one another — asked new questions about ethics, the self and the cosmos.
      The philosopher Karl Jaspers called it the "Axial Age".
  - target: upanishads
    text: >-
      In the Ganges valley, the Upanishads turn ritual into inquiry: what is the self (ātman), and how
      does it relate to ultimate reality (brahman)? Karma and rebirth enter the conversation.
  - target: buddha
    text: >-
      The Buddha teaches a middle way out of suffering — no gods required, only insight and conduct.
      His dates are disputed; most scholars place him in the 5th century BCE.
  - target: mahavira
    text: >-
      His contemporary Mahavira teaches ahimsa, non-violence to every living thing, the heart of Jainism.
  - target: confucius
    text: >-
      In a China of warring states, Confucius argues that order begins with personal virtue, ritual
      and the duties between ruler and ruled, parent and child. His students write it down as the Analects.
  - target: daodejing
    text: >-
      The Daodejing answers with the Dao — the way that cannot be named — and the wisdom of not forcing things.
  - target: return-exile
    text: >-
      In exile in Babylon and after the return, Judah's scribes and prophets shape the Hebrew Bible
      and an uncompromising monotheism.
  - target: thales
    text: >-
      On the Ionian coast, Thales looks for natural causes instead of divine ones — the beginning of
      Greek philosophy and science.
  - target: socrates
    text: >-
      In democratic Athens, Socrates asks what justice and virtue really are — and is put to death for it.
      Through Plato and Aristotle, his questions still shape how we argue.
  - target: thread:scripts
    zoom: 0.9
    text: >-
      None of this survives without writing. Explore the threads (press L) to follow scripts, numerals and
      the Silk Road that would soon carry these ideas between worlds.
