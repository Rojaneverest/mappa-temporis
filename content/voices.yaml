  - { id: v-hunminjeongeum, lane: joseon, date: 1446 CE, text: "Our language differs from China's, so the common people cannot write what they mean. I have made twenty-eight letters.", speaker: King Sejong, work: Hunminjeongeum, preface, prominence: 3, sources: [wikipedia:Hunminjeongeum] }
