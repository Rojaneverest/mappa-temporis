  - { id: v-manifesto, lane: germany, date: 1848 CE, text: "Workers of all countries, unite!", speaker: Marx and Engels, work: The Communist Manifesto, prominence: 3, sources: [wikipedia:The_Communist_Manifesto] }
  - { id: v-darwin, lane: united-kingdom, date: 1859 CE, text: "There is grandeur in this view of life.", speaker: Charles Darwin, work: On the Origin of Species, prominence: 4, sources: [wikipedia:On_the_Origin_of_Species] }
