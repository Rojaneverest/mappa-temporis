  - { id: v-analects-2-4, lane: zhou-eastern, date: c. 500 BCE, text: "At fifteen I set my heart on learning; at thirty I stood firm; at forty I had no doubts.", speaker: Confucius, work: Analects 2.4, prominence: 3, sources: [wikipedia:Analects] }
