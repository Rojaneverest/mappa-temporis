# Voices: short quotations from primary sources, set in italic beside landmark (P1–P2) lanes at the
# century zoom. Ancient texts are given in plain modern English unless a public-domain translation is
# named. Keep them short: the full passage belongs to the source, linked from the Folio.
voices:
  # ---------------- Near East
  - { id: v-ptahhotep, lane: egypt-old-kingdom, date: c. 2400 BCE, text: "Good speech is more hidden than greenstone, yet it is found among the women at the grindstones.", speaker: Ptahhotep, work: The Maxims of Ptahhotep, prominence: 3, sources: [wikipedia:The_Maxims_of_Ptahhotep] }
  - { id: v-be-a-scribe, lane: egypt-middle-kingdom, date: c. 1900 BCE, text: "Be a scribe: it saves you from toil, and protects you from every kind of labour.", speaker: An Egyptian teacher, work: The Satire of the Trades, prominence: 4, sources: [wikipedia:The_Satire_of_the_Trades] }
  - { id: v-hammurabi, lane: old-babylon, date: c. 1754 BCE, text: "To bring about the rule of righteousness in the land, so that the strong should not harm the weak.", speaker: Hammurabi, work: Prologue to the Code, translation: L. W. King (1910), prominence: 3, sources: [wikipedia:Code_of_Hammurabi] }
  - { id: v-gilgamesh, lane: old-babylon, date: c. 1800 BCE, text: "Gilgamesh, where are you wandering? The life you seek you will not find.", speaker: Siduri the alewife, work: Epic of Gilgamesh (Old Babylonian version), prominence: 3, sources: [wikipedia:Epic_of_Gilgamesh] }
  - { id: v-aten-hymn, lane: egypt-new-kingdom, date: c. 1345 BCE, text: "How many are your works, hidden from our sight, O sole god, beside whom there is no other!", speaker: Akhenaten, work: Great Hymn to the Aten, prominence: 3, sources: [wikipedia:Great_Hymn_to_the_Aten] }
  - { id: v-sennacherib, lane: neo-assyria, date: 701 BCE, text: "Hezekiah himself I shut up in Jerusalem, his royal city, like a bird in a cage.", speaker: Sennacherib, work: The Sennacherib Prism, prominence: 3, sources: [wikipedia:Sennacherib's_Annals] }
  - { id: v-cyrus, lane: achaemenid, date: 539 BCE, text: "I am Cyrus, king of the world, great king, mighty king, king of Babylon.", speaker: Cyrus the Great, work: The Cyrus Cylinder, prominence: 3, sources: [wikipedia:Cyrus_Cylinder] }
  - { id: v-gift-of-nile, lane: egypt-late-period, date: c. 430 BCE, text: "Egypt is the gift of the river.", speaker: Herodotus, work: Histories 2.5, prominence: 3, sources: [wikipedia:Herodotus] }
  - { id: v-shapur-valerian, lane: sasanian, date: c. 262 CE, text: "Caesar Valerian we captured with our own hands.", speaker: Shapur I, work: Inscription at Naqsh-e Rostam, prominence: 3, sources: [wikipedia:Shapur_I] }
  - { id: v-iqra, lane: early-islam, date: c. 610 CE, text: "Recite in the name of your Lord who created — created humankind from a clinging clot.", speaker: The Quran, work: Surah 96:1–2, prominence: 3, sources: [wikipedia:Al-Alaq] }
  - { id: v-al-kindi, lane: abbasid, date: c. 850 CE, text: "We should not be ashamed to recognise truth and take it in, from wherever it comes to us.", speaker: Al-Kindi, work: On First Philosophy, prominence: 3, sources: [wikipedia:Al-Kindi] }
  - { id: v-ibn-al-haytham, lane: fatimids, date: c. 1025 CE, text: "The seeker after truth is not one who studies the writings of the ancients and simply trusts them.", speaker: Ibn al-Haytham, work: Doubts Concerning Ptolemy, prominence: 3, sources: [wikipedia:Ibn_al-Haytham] }
  - { id: v-khayyam, lane: seljuks, date: c. 1100 CE, text: "The Moving Finger writes; and, having writ, moves on.", speaker: Omar Khayyam, work: Rubaiyat, translation: Edward FitzGerald (1859), prominence: 3, sources: [wikipedia:Rubaiyat_of_Omar_Khayyam] }
  - { id: v-ibn-khaldun, lane: mamluks, date: 1377 CE, text: "History is the record of human society, which is the civilisation of the world.", speaker: Ibn Khaldun, work: Muqaddimah, prominence: 3, sources: [wikipedia:Muqaddimah] }
  - { id: v-ataturk, lane: turkey, date: 1931 CE, text: "Peace at home, peace in the world.", speaker: Mustafa Kemal Atatürk, work: Speech, 1931, prominence: 4, sources: [wikipedia:Peace_at_Home,_Peace_in_the_World] }

  # ---------------- Europe
  - { id: v-sappho, lane: greek-poleis, date: c. 600 BCE, text: "Some say horsemen, some foot soldiers, some ships are the finest thing on the dark earth; I say it is whatever one loves.", speaker: Sappho, work: Fragment 16, prominence: 3, sources: [wikipedia:Sappho_16] }
  - { id: v-herodotus, lane: greek-poleis, date: c. 430 BCE, text: "So that the deeds of people may not fade with time.", speaker: Herodotus, work: Histories, opening, prominence: 4, sources: [wikipedia:Histories_(Herodotus)] }
