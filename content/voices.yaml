  - { id: v-augustus-marble, lane: roman-empire, date: 14 CE, text: "I found Rome a city of brick and left it a city of marble.", speaker: Augustus, work: Suetonius, Life of Augustus 28, prominence: 3, sources: [wikipedia:Augustus] }
