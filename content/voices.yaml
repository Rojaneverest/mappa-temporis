  - { id: v-marcus-aurelius, lane: roman-empire, date: c. 170 CE, text: "Waste no more time arguing about what a good man should be. Be one.", speaker: Marcus Aurelius, work: Meditations 10.16, prominence: 4, sources: [wikipedia:Meditations] }
  - { id: v-jerome-410, lane: western-roman, date: 410 CE, text: "The city which had taken the whole world was itself taken.", speaker: Jerome, work: Letter 127, prominence: 3, sources: [wikipedia:Sack_of_Rome_(410)] }
  - { id: v-alcuin, lane: vikings, date: 793 CE, text: "Never before has such terror appeared in Britain as we have now suffered from a pagan race.", speaker: Alcuin of York, work: Letter on Lindisfarne, prominence: 3, sources: [wikipedia:Lindisfarne] }
  - { id: v-rus-invitation, lane: rus, date: 862 CE, text: "Our land is great and rich, but there is no order in it. Come and rule over us.", speaker: The Slavs to the Varangians, work: Primary Chronicle, prominence: 3, sources: [wikipedia:Primary_Chronicle] }
  - { id: v-magna-carta, lane: england, date: 1215 CE, text: "No free man shall be seized or imprisoned except by the lawful judgement of his peers or by the law of the land.", speaker: Magna Carta, work: Clause 39, prominence: 3, sources: [wikipedia:Magna_Carta] }
  - { id: v-dante, lane: italian-cities, date: c. 1314 CE, text: "Abandon all hope, you who enter here.", speaker: Dante, work: Inferno 3.9, prominence: 3, sources: [wikipedia:Inferno_(Dante)] }
  - { id: v-luther, lane: holy-roman-empire, date: 1521 CE, text: "Here I stand. I can do no other.", speaker: Martin Luther, work: At the Diet of Worms (as reported), prominence: 3, sources: [wikipedia:Diet_of_Worms] }
  - { id: v-copernicus, lane: poland, date: 1543 CE, text: "In the middle of everything sits the Sun.", speaker: Nicolaus Copernicus, work: On the Revolutions 1.10, prominence: 3, sources: [wikipedia:De_revolutionibus_orbium_coelestium] }
  - { id: v-galileo, lane: italian-cities, date: 1623 CE, text: "The book of nature is written in the language of mathematics.", speaker: Galileo Galilei, work: The Assayer, prominence: 3, sources: [wikipedia:The_Assayer] }
  - { id: v-descartes, lane: france, date: 1637 CE, text: "I think, therefore I am.", speaker: René Descartes, work: Discourse on the Method, prominence: 3, sources: [wikipedia:Cogito,_ergo_sum] }
  - { id: v-newton, lane: england, date: 1675 CE, text: "If I have seen further, it is by standing on the shoulders of giants.", speaker: Isaac Newton, work: Letter to Robert Hooke, prominence: 3, sources: [wikipedia:Standing_on_the_shoulders_of_giants] }
