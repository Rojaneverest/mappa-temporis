  - { id: v-mani-aksum, lane: aksum, date: c. 260 CE, text: "There are four great kingdoms on earth: Babylon and Persia, Rome, Aksum, and China.", speaker: Mani, work: Kephalaia, prominence: 3, sources: [wikipedia:Kingdom_of_Aksum] }
