# Coverage targets (Phase 3 balance audit, `pnpm coverage`).
# A cell's target = the era's baseline × the region's weight. Baselines grow with how much
# history an era holds on the sheet; weights keep every region from becoming a footnote
# while admitting that some regions have more recorded history in some eras.
eras:
  neolithic: 5
  early-bronze: 5
  bronze: 7
  iron-age: 8
  classical: 28
  middle-ages: 40
  early-modern: 26
  industrial: 24
  world-wars: 24
  contemporary: 12
regions:
  americas: 1
  africa: 1
  europe: 1.4
  near-east: 1.4
  steppe: 0.7
  south-asia: 1
  east-asia: 1.3
  southeast-asia: 0.8
  oceania: 0.5
# Cells where the record itself is thin: the target is what archaeology can honestly offer at
# this scale, not the region weight. Revisit as new lanes are justified.
overrides:
  africa/early-bronze: 3       # West and East African Neolithic sites only; Egypt and Kerma count elsewhere
  africa/bronze: 6
  southeast-asia/neolithic: 3
  southeast-asia/early-bronze: 2
  southeast-asia/bronze: 5
  southeast-asia/iron-age: 4
  oceania/early-bronze: 1      # Australia and New Guinea before the Lapita voyages
  oceania/iron-age: 3
  oceania/classical: 7         # the Polynesian 'Long Pause'; few dated events anywhere in Oceania
  oceania/middle-ages: 19
  oceania/early-modern: 12
# Pairs the duplicate check flags that are really different events.
distinct:
  - [cuban-revolution, missile-crisis]
  - [hong-kong-1997, shenzhou-5]
  - [wto-china, shenzhou-5]
  - [battle-britain, india-independence-uk]
  - [ataturk, turkish-alphabet]
  - [isfahan, shah-abbas]
  - [gateway-sun, titicaca-fields]
  - [pokhran-ii, chagai]
  - [tasman, tasman-fiji]
  - [muhammad-ali, citadel-massacre]
  - [isis, mosul-2017]
  - [nigeria-independence, madagascar-independence]
  - [khiva-1873, geok-tepe]
