# The Near East from the first farmers to c. 800 BCE.
lanes:
  # ------------------------------------------------------------------ egypt
  - id: naqada
    name: Predynastic Egypt (Naqada)
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 3
    basis: archaeology
    span: c. 4000 – c. 3100 BCE
    relations:
      - { type: becomes, lane: egypt-early-dynastic, at: c. 3100 BCE }
    events:
      - { id: hieroglyphs-first, date: c. 3200 BCE, label: "The first hieroglyphs, on labels in a royal tomb at Abydos", prominence: 2, thread: scripts, confidence: probable, sources: [wikipedia:Egyptian_hieroglyphs] }
    sources: [wikipedia:Naqada_culture]

  - id: egypt-early-dynastic
    name: Early Dynastic Egypt
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 2
    span: c. 3100 – 2686 BCE
    relations:
      - { type: becomes, lane: egypt-old-kingdom, at: 2686 BCE }
    events:
      - { id: narmer, date: c. 3100 BCE, label: "Narmer unites Upper and Lower Egypt", prominence: 2, themes: [government], confidence: probable, sources: [wikipedia:Narmer] }
    sources: [wikipedia:Early_Dynastic_Period_(Egypt)]

  - id: egypt-old-kingdom
    name: Old Kingdom Egypt
    endonym: { text: 𓆎𓅓𓏏𓊖, script: Egyp, translit: Kemet }
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 1
    span: 2686 – 2181 BCE
    cliopatria: ["Old Kingdom of Egypt", "Egypt"]
    relations:
      - { type: becomes, lane: egypt-first-intermediate, at: 2181 BCE }
    events:
      - { id: step-pyramid, date: c. 2650 BCE, label: "Imhotep builds Djoser's Step Pyramid", prominence: 2, themes: [art], sources: [wikipedia:Pyramid_of_Djoser] }
      - { id: great-pyramid, date: c. 2560 BCE, label: "The Great Pyramid of Giza — the tallest building on Earth for 3,800 years", prominence: 1, themes: [art, technology], sources: [wikipedia:Great_Pyramid_of_Giza] }
      - { id: sphinx, date: c. 2500 BCE, label: "The Great Sphinx is carved", prominence: 3, themes: [art], confidence: probable, sources: [wikipedia:Great_Sphinx_of_Giza] }
      - { id: old-kingdom-collapse, date: c. 2181 BCE, label: "Low Nile floods and famine: the Old Kingdom collapses", prominence: 3, themes: [climate], confidence: probable, sources: [wikipedia:4.2-kiloyear_event] }
    images:
      - { id: giza-pyramids, source: "commons:File:All Gizah Pyramids.jpg", date: c. 2560 BCE, prominence: 1, treatment: plate, caption: "The pyramids of Giza" }
    sources: [wikipedia:Old_Kingdom_of_Egypt]

  - id: egypt-first-intermediate
    name: First Intermediate Period
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 3
    span: 2181 – 2055 BCE
    relations:
      - { type: becomes, lane: egypt-middle-kingdom, at: 2055 BCE }
    sources: [wikipedia:First_Intermediate_Period_of_Egypt]

  - id: egypt-middle-kingdom
    name: Middle Kingdom Egypt
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 2
    span: 2055 – 1650 BCE
    relations:
      - { type: becomes, lane: egypt-second-intermediate, at: 1650 BCE }
    events:
      - { id: mentuhotep, date: 2055 BCE, label: "Mentuhotep II reunites Egypt", prominence: 3, sources: [wikipedia:Mentuhotep_II] }
      - { id: sinuhe, date: c. 1875 BCE, label: "The Story of Sinuhe, a classic of Egyptian literature", prominence: 4, themes: [art], sources: [wikipedia:Story_of_Sinuhe] }
    sources: [wikipedia:Middle_Kingdom_of_Egypt]

  - id: egypt-second-intermediate
    name: Second Intermediate Period
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 3
    span: 1650 – 1550 BCE
    relations:
      - { type: becomes, lane: egypt-new-kingdom, at: 1550 BCE }
    events:
      - { id: hyksos, date: c. 1650 BCE, label: "The Hyksos rule the Nile Delta, bringing horse and chariot", prominence: 3, themes: [migration, technology], sources: [wikipedia:Hyksos] }
    sources: [wikipedia:Second_Intermediate_Period_of_Egypt]

  - id: egypt-new-kingdom
    name: New Kingdom Egypt
    region: near-east
    group: egypt
    sphere: egyptian
    prominence: 1
    span: 1550 – 1069 BCE
    cliopatria: ["New Kingdom of Egypt"]
    relations:
      - { type: becomes, lane: egypt-third-intermediate, at: 1069 BCE }
      - { type: conquers, lane: kerma, at: c. 1500 BCE }
    events:
      - { id: hatshepsut, date: 1479 BCE, label: "Hatshepsut rules as pharaoh and sends ships to Punt", prominence: 2, themes: [women, trade], sources: [wikipedia:Hatshepsut] }
      - { id: megiddo, date: 1457 BCE, label: "Thutmose III wins at Megiddo — the first battle recorded in detail", prominence: 4, themes: [war], sources: [wikipedia:Battle_of_Megiddo_(15th_century_BC)] }
      - { id: amarna-letters, date: c. 1350 BCE, label: "The Amarna letters: great kings write to each other as 'brothers'", prominence: 3, themes: [diplomacy], sources: [wikipedia:Amarna_letters] }
      - { id: akhenaten, date: c. 1346 BCE, label: "Akhenaten worships one god, the sun-disc Aten", prominence: 2, themes: [religion], sources: [wikipedia:Akhenaten] }
      - { id: tutankhamun, date: c. 1323 BCE, label: "The boy-king Tutankhamun is buried with his golden mask", prominence: 2, themes: [art], sources: [wikipedia:Tutankhamun] }
      - { id: kadesh, date: 1274 BCE, label: "Ramesses II fights the Hittites at Kadesh; the first known peace treaty follows", prominence: 2, themes: [war, diplomacy], sources: [wikipedia:Battle_of_Kadesh] }
      - { id: sea-peoples, date: c. 1177 BCE, label: "Ramesses III repels the Sea Peoples", prominence: 2, themes: [war, migration], sources: [wikipedia:Sea_Peoples] }
    sources: [wikipedia:New_Kingdom_of_Egypt]

  # ------------------------------------------------------------------ levant
  - id: natufian
    name: Natufians
    region: near-east
    group: levant
    sphere: hebrew
    prominence: 3
    basis: archaeology
    span: c. 12500 – c. 9500 BCE
    relations:
      - { type: becomes, lane: ppn-levant, at: c. 9500 BCE }
    events:
      - { id: natufian-villages, date: c. 10000 BCE, label: "Foragers settle in year-round villages and harvest wild cereals", prominence: 3, sources: [wikipedia:Natufian_culture] }
    sources: [wikipedia:Natufian_culture]

  - id: ppn-levant
    name: First farmers of the Levant
    region: near-east
    group: levant
    sphere: hebrew
    prominence: 2
    basis: archaeology
    span: c. 9500 – c. 4500 BCE
    events:
      - { id: first-farming, date: c. 9500 BCE, label: "Wheat, barley and lentils are domesticated in the Fertile Crescent", prominence: 1, themes: [technology], sources: [wikipedia:Neolithic_Revolution] }
      - { id: jericho-tower, date: c. 8000 BCE, label: "Jericho raises a stone tower and walls", prominence: 3, themes: [art], sources: [wikipedia:Tower_of_Jericho] }
    sources: [wikipedia:Pre-Pottery_Neolithic_A]

  - id: canaan
    name: Canaanite city-states
    region: near-east
    group: levant
    sphere: punic
    prominence: 3
    span: c. 3000 – c. 1150 BCE
    relations:
      - { type: becomes, lane: phoenicia, at: c. 1150 BCE }
    events:
      - { id: proto-sinaitic, date: c. 1850 BCE, label: "Proto-Sinaitic: the first alphabet, a few dozen letters from hieroglyphs", prominence: 1, thread: alphabet, confidence: probable, sources: [wikipedia:Proto-Sinaitic_script] }
      - { id: ugarit, date: c. 1400 BCE, label: "Ugarit writes an alphabet in cuneiform signs", prominence: 4, thread: alphabet, sources: [wikipedia:Ugaritic_alphabet] }
    sources: [wikipedia:Canaan]

  - id: early-israel
    name: Early Israel
    region: near-east
    group: levant
    sphere: hebrew
    prominence: 4
    span: c. 1200 – c. 930 BCE
    relations:
      - { type: splits-into, lanes: [israel-kingdom, judah], at: c. 930 BCE }
    events:
      - { id: merneptah, date: c. 1208 BCE, label: "The Merneptah Stele: the first mention of 'Israel'", prominence: 3, sources: [wikipedia:Merneptah_Stele] }
    sources: [wikipedia:History_of_ancient_Israel_and_Judah]

  # ------------------------------------------------------------------ anatolia
  - id: gobekli-tepe
    name: Göbekli Tepe
    region: near-east
    group: anatolia
    sphere: persian
    prominence: 2
    basis: archaeology
    span: c. 9600 – c. 8000 BCE
    events:
      - { id: gobekli-pillars, date: c. 9500 BCE, label: "Hunters raise carved stone pillars — monuments before farming", prominence: 1, themes: [art, religion], sources: [wikipedia:Göbekli_Tepe] }
    images:
      - { id: gobekli-pillars-photo, source: "commons:File:Göbekli Tepe, Urfa.jpg", date: c. 9500 BCE, prominence: 2, treatment: plate, caption: "Göbekli Tepe's carved pillars, built by foragers" }
