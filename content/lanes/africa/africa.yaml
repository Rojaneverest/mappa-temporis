    region: africa
    group: maghreb
    sphere: punic
    prominence: 2
    span: 814 – 146 BCE
    cliopatria: ["Carthage"]
    events:
      - { id: carthage-founded, date: 814 BCE, label: "Settlers from Tyre found Carthage (traditional date)", prominence: 3, confidence: legendary, themes: [migration], sources: [wikipedia:Ancient_Carthage] }
      - { id: hanno, date: c. 500 BCE, label: "Hanno the Navigator sails down the West African coast", prominence: 3, confidence: probable, themes: [exploration], sources: [wikipedia:Hanno_the_Navigator] }
      - { id: himera, date: 480 BCE, label: "Defeat at Himera checks Carthage in Sicily", prominence: 4, themes: [war], sources: [wikipedia:Battle_of_Himera_(480_BC)] }
      - { id: first-punic-war, date: 264 BCE, label: "The First Punic War with Rome begins", prominence: 3, themes: [war], sources: [wikipedia:First_Punic_War] }
      - { id: hannibal-alps, date: 218 BCE, label: "Hannibal crosses the Alps with his elephants", prominence: 1, themes: [war], sources: [wikipedia:Hannibal's_crossing_of_the_Alps] }
      - { id: cannae, date: 216 BCE, label: "Cannae: Hannibal's masterpiece", prominence: 3, themes: [war], sources: [wikipedia:Battle_of_Cannae] }
      - { id: zama, date: 202 BCE, label: "Scipio defeats Hannibal at Zama", prominence: 3, themes: [war], sources: [wikipedia:Battle_of_Zama] }
    images:
      - { id: carthage-tanit, source: "commons:File:Dekadrachm, Carthage, Goddess Tanit, c. 260 BC - National Museum of American History - DSC00261.jpg", date: c. 260 BCE, prominence: 3, treatment: cutout, caption: "Carthaginian dekadrachm with the goddess Tanit" }
    sources: [wikipedia:Ancient_Carthage]

