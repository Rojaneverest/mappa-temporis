# East Asia to c. 800 BCE.
lanes:
  - id: early-neolithic-china
    name: First farmers of China
    region: east-asia
    group: china
    sphere: sinic
    prominence: 3
    basis: archaeology
    span: c. 10000 – c. 5000 BCE
    relations:
      - { type: becomes, lane: yangshao, at: c. 5000 BCE }
    events:
      - { id: rice, date: c. 7000 BCE, label: "Rice is domesticated along the Yangtze, millet in the north", prominence: 1, themes: [technology], confidence: probable, sources: [wikipedia:Domestication_of_rice] }
      - { id: jiahu, date: c. 6600 BCE, label: "Jiahu: bone flutes that can still be played", prominence: 4, themes: [art], sources: [wikipedia:Jiahu] }
    sources: [wikipedia:Neolithic_China]

  - id: yangshao
    name: Yangshao culture
    region: east-asia
    group: china
    sphere: sinic
    prominence: 2
    basis: archaeology
    span: c. 5000 – c. 3000 BCE
    relations:
      - { type: becomes, lane: longshan, at: c. 3000 BCE }
    events:
      - { id: yangshao-pottery, date: c. 4500 BCE, label: "Painted pottery villages along the Yellow River", prominence: 3, themes: [art], sources: [wikipedia:Yangshao_culture] }
    sources: [wikipedia:Yangshao_culture]

  - id: liangzhu
    name: Liangzhu
    region: east-asia
    group: china
    sphere: sinic
    prominence: 3
    basis: archaeology
    span: c. 3300 – c. 2300 BCE
    events:
      - { id: liangzhu-dams, date: c. 3000 BCE, label: "Liangzhu's jade and dams: one of East Asia's first states", prominence: 3, themes: [technology], sources: [wikipedia:Liangzhu_culture] }
    sources: [wikipedia:Liangzhu_culture]

  - id: longshan
    name: Longshan culture
    region: east-asia
    group: china
    sphere: sinic
    prominence: 3
    basis: archaeology
    span: c. 3000 – c. 1900 BCE
    relations:
      - { type: becomes, lane: xia, at: c. 1900 BCE }
    sources: [wikipedia:Longshan_culture]

  - id: xia
    name: Xia · Erlitou
    region: east-asia
    group: china
    sphere: sinic
    prominence: 2
    basis: legend
    span: c. 2070 – c. 1600 BCE
    relations:
