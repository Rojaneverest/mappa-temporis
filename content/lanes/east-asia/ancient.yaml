    events:
      - { id: yu-flood, date: c. 2070 BCE, label: "Yu the Great tames the flood and founds the Xia (tradition)", prominence: 3, confidence: legendary, sources: [wikipedia:Xia_dynasty] }
      - { id: erlitou, date: c. 1800 BCE, label: "Erlitou: palaces and the first bronze ritual vessels", prominence: 3, sources: [wikipedia:Erlitou_culture] }
    sources: [wikipedia:Xia_dynasty]

  - id: sanxingdui
    name: Sanxingdui
    region: east-asia
    group: china
    sphere: sinic
    prominence: 3
    basis: archaeology
    span: c. 1700 – c. 1150 BCE
    events:
      - { id: sanxingdui-masks, date: c. 1200 BCE, label: "Giant bronze masks with protruding eyes, unlike anything else in China", prominence: 3, themes: [art], sources: [wikipedia:Sanxingdui] }
    sources: [wikipedia:Sanxingdui]

  - id: shang
    name: Shang dynasty
    endonym: { text: 商, script: Hant, translit: Shāng }
    wikidata: Q172852
    region: east-asia
    group: china
    sphere: sinic
    prominence: 1
    span: c. 1600 – 1046 BCE
    cliopatria: ["Shang Dynasty"]
    relations:
      - { type: becomes, lane: western-zhou, at: 1046 BCE }
    events:
      - { id: yinxu, date: c. 1300 BCE, label: "The capital moves to Yin (Anyang)", prominence: 3, sources: [wikipedia:Yinxu] }
      - { id: oracle-bones, date: c. 1250 BCE, label: "Oracle bones: the first Chinese writing, questions put to the ancestors", prominence: 1, thread: scripts, themes: [religion, ideas], sources: [wikipedia:Oracle_bone_script] }
      - { id: fu-hao, date: c. 1200 BCE, label: "Fu Hao, queen and general, buried with 1,600 objects", prominence: 2, themes: [women, war], sources: [wikipedia:Fu_Hao] }
    sources: [wikipedia:Shang_dynasty]

  - id: western-zhou
    name: Western Zhou
    endonym: { text: 周, script: Hant, translit: Zhōu }
    region: east-asia
    group: china
    sphere: sinic
    prominence: 2
    span: 1046 – 771 BCE
    cliopatria: ["Zhou Dynasty"]
    relations:
      - { type: becomes, lane: zhou-eastern, at: 770 BCE }
    events:
      - { id: muye, date: 1046 BCE, label: "Battle of Muye: Zhou overthrows the Shang", prominence: 2, themes: [war], sources: [wikipedia:Battle_of_Muye] }
      - { id: mandate-heaven, date: c. 1046 BCE, label: "The Mandate of Heaven: rulers lose the right to rule when they rule badly", prominence: 2, themes: [ideas, government], sources: [wikipedia:Mandate_of_Heaven] }
    sources: [wikipedia:Western_Zhou]

  - id: mumun
    name: Mumun period
    region: east-asia
    group: korea
    sphere: korean-japanese
    prominence: 4
