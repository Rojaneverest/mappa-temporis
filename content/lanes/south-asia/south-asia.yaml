    region: south-asia
    group: northwest
    sphere: hellenic
    prominence: 3
    span: c. 180 BCE – c. 10 CE
    events:
      - { id: menander, date: c. 150 BCE, label: "King Menander debates a Buddhist monk in the Milinda Pañha", prominence: 3, themes: [ideas, religion], sources: [wikipedia:Menander_I] }
    sources: [wikipedia:Indo-Greek_Kingdom]

  - id: indo-scythian
    name: Indo-Scythians & Western Satraps
