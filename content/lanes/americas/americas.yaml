# The Americas, c. 800 BCE – 700 CE. Groups north → south: north-america, mesoamerica, andes.
lanes:
  # ------------------------------------------------------------------ north america
  - id: adena
    name: Adena culture
    region: americas
    group: north-america
    sphere: north-american
    prominence: 3
    basis: archaeology
    span: c. 800 BCE – c. 1 CE
    relations:
      - { type: becomes, lane: hopewell, at: c. 100 BCE }
    events:
      - { id: adena-mounds, date: c. 500 BCE, label: "Burial mounds and earthworks rise across the Ohio Valley", prominence: 3, sources: [wikipedia:Adena_culture] }
    sources: [wikipedia:Adena_culture]

  - id: hopewell
    name: Hopewell tradition
    region: americas
    group: north-america
    sphere: north-american
    prominence: 2
    basis: archaeology
    span: c. 100 BCE – c. 500 CE
    events:
      - { id: hopewell-trade, date: c. 100 CE, label: "Trade spans a continent: Rockies obsidian, Gulf shells, Lake Superior copper", prominence: 2, themes: [trade], sources: [wikipedia:Hopewell_tradition] }
      - { id: newark-earthworks, date: c. 250 CE, label: "The Newark Earthworks, aligned to the 18.6-year cycle of the Moon", prominence: 3, confidence: probable, themes: [sky, art], sources: [wikipedia:Newark_Earthworks] }
    images:
      - { id: hopewell-falcon, source: "commons:File:Hopewell culture falcon.jpg", date: c. 200 CE, prominence: 2, treatment: cutout, caption: "Hopewell falcon cut from sheet copper" }
    sources: [wikipedia:Hopewell_tradition]

  - id: basketmaker
    name: Ancestral Puebloans (Basketmaker)
    region: americas
    group: north-america
    sphere: north-american
    prominence: 4
    basis: archaeology
    span: c. 1500 BCE – c. 750 CE
    events:
      - { id: bow-arrow, date: c. 500 CE, label: "The bow and arrow and fired pottery reach the Southwest", prominence: 4, confidence: probable, themes: [technology], sources: [wikipedia:Basketmaker_III_era] }
    sources: [wikipedia:Ancestral_Puebloans]

  # ------------------------------------------------------------------ mesoamerica
  - id: olmec
    name: Olmecs
    region: americas
    group: mesoamerica
    sphere: mesoamerican
    prominence: 2
    basis: archaeology
    span: c. 1200 – 400 BCE
    cliopatria: ["Olmec Civilization"]
    events:
      - { id: la-venta, date: c. 900 BCE, label: "La Venta becomes the great Olmec centre; colossal stone heads", prominence: 2, themes: [art], sources: [wikipedia:La_Venta] }
      - { id: cascajal, date: c. 900 BCE, label: "The Cascajal Block — perhaps the first writing in the Americas", prominence: 4, confidence: disputed, thread: scripts, sources: [wikipedia:Cascajal_Block] }
    images:
      - { id: olmec-face, source: "met:310279", date: c. 700 BCE, prominence: 3, treatment: cutout, caption: "Olmec jade face" }
    sources: [wikipedia:Olmecs]

  - id: zapotec
    name: Zapotecs (Monte Albán)
    region: americas
    group: mesoamerica
    sphere: mesoamerican
    prominence: 3
    span: c. 500 BCE – c. 800 CE
    cliopatria: ["Zapotec Civilization"]
    events:
      - { id: monte-alban, date: c. 500 BCE, label: "Monte Albán is founded on a levelled mountaintop", prominence: 3, sources: [wikipedia:Monte_Albán] }
    sources: [wikipedia:Zapotec_civilization]

  - id: teotihuacan
    name: Teotihuacan
    region: americas
    group: mesoamerica
    sphere: mesoamerican
    prominence: 1
    basis: archaeology
    span: c. 100 BCE – c. 550 CE
    events:
      - { id: pyramid-sun, date: c. 200 CE, label: "The Pyramid of the Sun is completed", prominence: 2, themes: [art], sources: [wikipedia:Pyramid_of_the_Sun] }
      - { id: entrada, date: 378 CE, label: "Teotihuacan's envoy Siyaj K'ak' installs a new king at Tikal", prominence: 3, themes: [war], sources: [wikipedia:Siyaj_K'ak'] }
      - { id: teotihuacan-peak, date: c. 450 CE, label: "Around 100,000 people live in the city — among the largest on Earth", prominence: 2, sources: [wikipedia:Teotihuacan] }
      - { id: teotihuacan-burns, date: c. 550 CE, label: "The city centre is burned and abandoned", prominence: 3, confidence: probable, sources: [wikipedia:Teotihuacan] }
    images:
      - { id: teotihuacan-mask, source: "met:310647", date: c. 450 CE, prominence: 2, treatment: cutout, caption: "Stone mask from Teotihuacan" }
    sources: [wikipedia:Teotihuacan]

  - id: maya
    name: Maya
    region: americas
    group: mesoamerica
    sphere: mesoamerican
    prominence: 1
    span: c. 2000 BCE – 1697 CE
    cliopatria: ["Mayan City-States"]
    segments:
      - { name: Preclassic Maya, span: c. 2000 BCE – 250 CE, weight: 3 }
      - { name: Classic Maya, span: 250 – 900 CE, weight: 6 }
      - { name: Postclassic Maya, span: 900 – 1697 CE, weight: 3 }
    relations:
      - { type: influences, lane: teotihuacan, at: 378 CE }
    events:
      - { id: el-mirador, date: c. 300 BCE, label: "El Mirador, a Preclassic metropolis of colossal pyramids", prominence: 3, sources: [wikipedia:El_Mirador] }
      - { id: long-count-36, date: 36 BCE, label: "The oldest known Long Count date is carved at Chiapa de Corzo", prominence: 3, thread: calendars, sources: [wikipedia:Mesoamerican_Long_Count_calendar] }
      - { id: tikal-stela-29, date: 292 CE, label: "Tikal's Stela 29: the Classic Maya era of dated monuments begins", prominence: 4, sources: [wikipedia:Tikal] }
      - { id: calakmul-tikal, date: 562 CE, label: "Calakmul's Snake Kingdom defeats Tikal", prominence: 3, themes: [war], sources: [wikipedia:Calakmul] }
      - { id: pakal, date: 615 CE, label: "Pakal the Great becomes king of Palenque at 12", prominence: 2, sources: [wikipedia:K'inich_Janaab'_Pakal] }
      - { id: pakal-tomb, date: 683 CE, label: "Pakal is buried in the Temple of the Inscriptions", prominence: 4, themes: [art], sources: [wikipedia:Temple_of_the_Inscriptions] }
    images:
      - { id: maya-vessel, source: "met:662967", date: c. 700 CE, prominence: 2, treatment: cutout, caption: "Maya vessel with a mythological scene" }
    sources: [wikipedia:Maya_civilization]

