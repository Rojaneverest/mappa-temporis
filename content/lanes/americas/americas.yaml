    sources: [wikipedia:Teotihuacan]

  - id: maya
    name: Maya
    region: americas
    group: mesoamerica
    sphere: mesoamerican
    prominence: 1
    span: c. 2000 BCE – 1697 CE
    cliopatria: ["Mayan City-States"]
    segments:
      - { name: Preclassic Maya, span: c. 2000 BCE – 250 CE, weight: 3 }
      - { name: Classic Maya, span: 250 – 900 CE, weight: 6 }
      - { name: Postclassic Maya, span: 900 – 1697 CE, weight: 3 }
    relations:
      - { type: influences, lane: teotihuacan, at: 378 CE }
    events:
      - { id: el-mirador, date: c. 300 BCE, label: "El Mirador, a Preclassic metropolis of colossal pyramids", prominence: 3, sources: [wikipedia:El_Mirador] }
      - { id: long-count-36, date: 36 BCE, label: "The oldest known Long Count date is carved at Chiapa de Corzo", prominence: 3, thread: calendars, sources: [wikipedia:Mesoamerican_Long_Count_calendar] }
      - { id: tikal-stela-29, date: 292 CE, label: "Tikal's Stela 29: the Classic Maya era of dated monuments begins", prominence: 4, sources: [wikipedia:Tikal] }
      - { id: calakmul-tikal, date: 562 CE, label: "Calakmul's Snake Kingdom defeats Tikal", prominence: 3, themes: [war], sources: [wikipedia:Calakmul] }
      - { id: pakal, date: 615 CE, label: "Pakal the Great becomes king of Palenque at 12", prominence: 2, sources: [wikipedia:K'inich_Janaab'_Pakal] }
      - { id: pakal-tomb, date: 683 CE, label: "Pakal is buried in the Temple of the Inscriptions", prominence: 4, themes: [art], sources: [wikipedia:Temple_of_the_Inscriptions] }
      - { id: classic-collapse, date: c. 900 CE, label: "The Classic Maya collapse: the southern cities empty in drought", prominence: 2, themes: [climate], confidence: probable, sources: [wikipedia:Classic_Maya_collapse] }
      - { id: chichen-itza, date: c. 1000 CE, label: "Chichén Itzá and El Castillo", prominence: 1, themes: [art, sky], sources: [wikipedia:Chichen_Itza] }
      - { id: dresden-codex, date: c. 1200 CE, label: "The Dresden Codex tracks Venus and eclipses", prominence: 3, themes: [sky, science], thread: calendars, sources: [wikipedia:Dresden_Codex] }
      - { id: mani-auto-da-fe, date: 1562 CE, label: "Bishop Landa burns the Maya books at Maní", prominence: 3, themes: [ideas, religion], sources: [wikipedia:Diego_de_Landa] }
      - { id: nojpeten, date: 1697 CE, label: "Nojpetén, the last independent Maya city, falls", prominence: 3, themes: [war], sources: [wikipedia:Spanish_conquest_of_Petén] }
      - { id: maya-villages, date: c. 2000 BCE, label: "Farming villages appear in the Maya lands", prominence: 4, confidence: probable, sources: [wikipedia:Maya_civilization] }
      - { id: ceibal, date: c. 1000 BCE, label: "Ceibal: the first Maya ceremonial plaza", prominence: 3, themes: [religion], sources: [wikipedia:Ceibal_(Maya_site)] }
      - { id: nakbe, date: c. 750 BCE, label: "Nakbe raises the first great Maya platforms", prominence: 3, themes: [art], sources: [wikipedia:Nakbe] }
      - { id: san-bartolo, date: c. 100 BCE, label: "The San Bartolo murals: the Maya creation story in paint", prominence: 3, themes: [art, religion], sources: [wikipedia:San_Bartolo_(Maya_site)] }
      - { id: el-mirador-falls, date: c. 150 CE, label: "El Mirador is abandoned", prominence: 4, sources: [wikipedia:El_Mirador] }
      - { id: mayapan, date: c. 1220 CE, label: "Mayapán becomes the last great Maya capital", prominence: 4, sources: [wikipedia:Mayapan] }
    images:
      - { id: maya-vessel, source: "met:662967", date: c. 700 CE, prominence: 2, treatment: cutout, caption: "Maya vessel with a mythological scene" }
      - { id: tikal-temple, source: "commons:File:Tikal Temple I.jpg", date: 732 CE, prominence: 2, treatment: plate, caption: "Tikal, Temple I" }
      - { id: chichen-itza-castillo, source: "commons:File:Chichen Itza 3.jpg", date: c. 1000 CE, prominence: 2, treatment: plate, caption: "El Castillo, Chichén Itzá" }
