# The Americas, c. 800 BCE – 700 CE. Groups north → south: north-america, mesoamerica, andes.
lanes:
  # ------------------------------------------------------------------ north america
  - id: adena
    name: Adena culture
    region: americas
    group: north-america
    sphere: north-american
    prominence: 3
    basis: archaeology
    span: c. 800 BCE – c. 1 CE
    relations:
      - { type: becomes, lane: hopewell, at: c. 100 BCE }
    events:
      - { id: adena-mounds, date: c. 500 BCE, label: "Burial mounds and earthworks rise across the Ohio Valley", prominence: 3, sources: [wikipedia:Adena_culture] }
      - { id: serpent-mound, date: c. 300 BCE, label: "Serpent Mound, Ohio (date disputed)", prominence: 3, themes: [art, religion], confidence: disputed, sources: [wikipedia:Serpent_Mound] }
    sources: [wikipedia:Adena_culture]

  - id: hopewell
    name: Hopewell tradition
    region: americas
    group: north-america
    sphere: north-american
    prominence: 2
    basis: archaeology
    span: c. 100 BCE – c. 500 CE
    events:
      - { id: hopewell-trade, date: c. 100 CE, label: "Trade spans a continent: Rockies obsidian, Gulf shells, Lake Superior copper", prominence: 2, themes: [trade], sources: [wikipedia:Hopewell_tradition] }
      - { id: newark-earthworks, date: c. 250 CE, label: "The Newark Earthworks, aligned to the 18.6-year cycle of the Moon", prominence: 3, confidence: probable, themes: [sky, art], sources: [wikipedia:Newark_Earthworks] }
      - { id: hopewell-obsidian, date: c. 100 CE, label: "Obsidian from Yellowstone and shells from Florida meet in Ohio", prominence: 4, themes: [trade], sources: [wikipedia:Hopewell_Interaction_Sphere] }
      - { id: hopewell-fades, date: c. 500 CE, label: "The Hopewell exchange network fades", prominence: 4, themes: [trade], sources: [wikipedia:Hopewell_tradition] }
    images:
      - { id: hopewell-falcon, source: "commons:File:Hopewell culture falcon.jpg", date: c. 200 CE, prominence: 2, treatment: cutout, caption: "Hopewell falcon cut from sheet copper" }
    sources: [wikipedia:Hopewell_tradition]

  - id: basketmaker
    name: Ancestral Puebloans (Basketmaker)
    region: americas
    group: north-america
    sphere: north-american
    prominence: 4
    basis: archaeology
    span: c. 1500 BCE – c. 750 CE
    events:
      - { id: bow-arrow, date: c. 500 CE, label: "The bow and arrow and fired pottery reach the Southwest", prominence: 4, confidence: probable, themes: [technology], sources: [wikipedia:Basketmaker_III_era] }
      - { id: maize-southwest, date: c. 1500 BCE, label: "Maize farming takes hold in the American Southwest", prominence: 4, themes: [technology], confidence: probable, sources: [wikipedia:Basketmaker_culture] }
    sources: [wikipedia:Ancestral_Puebloans]

  # ------------------------------------------------------------------ mesoamerica
  - id: olmec
    name: Olmecs
    region: americas
    group: mesoamerica
    sphere: mesoamerican
    prominence: 2
    basis: archaeology
    span: c. 1200 – 400 BCE
    cliopatria: ["Olmec Civilization"]
    events:
      - { id: la-venta, date: c. 900 BCE, label: "La Venta becomes the great Olmec centre; colossal stone heads", prominence: 2, themes: [art], sources: [wikipedia:La_Venta] }
      - { id: cascajal, date: c. 900 BCE, label: "The Cascajal Block — perhaps the first writing in the Americas", prominence: 4, confidence: disputed, thread: scripts, sources: [wikipedia:Cascajal_Block] }
      - { id: colossal-heads, date: c. 1200 BCE, label: "San Lorenzo's colossal stone heads", prominence: 2, themes: [art], sources: [wikipedia:Olmec_colossal_heads] }
      - { id: olmec-ballgame, date: c. 1000 BCE, label: "Rubber balls and the Mesoamerican ballgame", prominence: 3, themes: [religion], sources: [wikipedia:Mesoamerican_ballgame] }
      - { id: la-venta-abandoned, date: c. 400 BCE, label: "La Venta is abandoned", prominence: 4, sources: [wikipedia:La_Venta] }
    images:
      - { id: olmec-face, source: "met:310279", date: c. 700 BCE, prominence: 3, treatment: cutout, caption: "Olmec jade face" }
    sources: [wikipedia:Olmecs]

  - id: zapotec
