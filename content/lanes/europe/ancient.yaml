# Europe from the first farmers to c. 800 BCE.
lanes:
  - id: neolithic-britain
    name: Neolithic & Bronze Age Britain
    region: europe
    group: british-isles
    sphere: celtic-germanic
    prominence: 3
    basis: archaeology
    span: c. 4000 – c. 800 BCE
    events:
      - { id: stonehenge-begun, date: c. 3000 BCE, label: "Stonehenge begins as a circular ditch and bank", prominence: 3, themes: [religion], sources: [wikipedia:Stonehenge] }
      - { id: stonehenge-sarsens, date: c. 2500 BCE, label: "The great sarsen stones of Stonehenge are raised", prominence: 1, themes: [art, sky], sources: [wikipedia:Stonehenge] }
      - { id: beakers, date: c. 2450 BCE, label: "Bell Beaker newcomers replace most of Britain's ancestry", prominence: 3, themes: [migration], sources: [wikipedia:Bell_Beaker_culture] }
      - { id: skara-brae, date: c. 3100 BCE, label: "Skara Brae, a stone village in Orkney", prominence: 3, sources: [wikipedia:Skara_Brae] }
      - { id: amesbury-archer, date: c. 2300 BCE, label: "The Amesbury Archer, buried near Stonehenge, came from the Alps", prominence: 4, themes: [migration], sources: [wikipedia:Amesbury_Archer] }
    images:
      - { id: stonehenge-view, source: "commons:File:Stonehenge2007 07 30.jpg", date: c. 2500 BCE, prominence: 2, treatment: plate, caption: "Stonehenge, aligned to the solstices" }
    sources: [wikipedia:Neolithic_British_Isles]

