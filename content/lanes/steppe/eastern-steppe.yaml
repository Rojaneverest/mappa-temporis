# The eastern steppe, 800 BCE – 700 CE.
lanes:
  - id: xiongnu
    name: Xiongnu
    region: steppe
    sphere: steppe
    prominence: 2
    span: 209 BCE – 91 CE
    relations:
      - { type: splits-into, lanes: [southern-xiongnu], at: 48 CE }
    events:
      - id: modu
        date: 209 BCE
        label: Modu Chanyu unites the Xiongnu tribes
        prominence: 2
        sources: [wikipedia:Modu_Chanyu]
      - id: baideng
        date: 200 BCE
        label: Battle of Baideng — Xiongnu trap the first Han emperor
        prominence: 3
        themes: [war]
        sources: [wikipedia:Battle_of_Baideng]
      - id: xiongnu-split
        date: 48 CE
        label: Xiongnu split into northern and southern hordes
        prominence: 3
        sources: [wikipedia:Southern_Xiongnu]
      - id: ikh-bayan
        date: 89 CE
        label: Han armies rout the Northern Xiongnu
        prominence: 4
        themes: [war]
        sources: [wikipedia:Battle_of_Ikh_Bayan]
    images:
      - id: xiongnu-buckle
        source: "met:322484"
        date: c. 200 BCE
        prominence: 2
        treatment: cutout
        caption: "Belt buckle: felines attacking ibexes"
    sources: [wikipedia:Xiongnu]

  - id: xianbei
    name: Xianbei
    region: steppe
    sphere: steppe
    prominence: 3
    span: c. 93 – 234 CE
    relations:
      - { type: succeeds, lane: xiongnu, at: c. 93 CE }
    sources: [wikipedia:Xianbei]

  - id: rouran
    name: Rouran Khaganate
    region: steppe
    sphere: steppe
    prominence: 3
    span: c. 330 – 555 CE
    relations:
      - { type: succeeds, lane: xianbei, at: c. 330 CE }
    sources: [wikipedia:Rouran_Khaganate]

  - id: gokturks
    name: Göktürk Khaganate
    region: steppe
    sphere: steppe
    prominence: 2
    span: 552 – 744 CE
    relations:
      - { type: conquers, lane: rouran, at: 552 CE }
    events:
      - id: bumin
        date: 552 CE
        label: Bumin Qaghan overthrows the Rouran — the first Turkic empire
        prominence: 2
        sources: [wikipedia:Bumin_Qaghan]
      - id: turk-split
        date: c. 583 CE
        label: Khaganate splits into eastern and western halves
        prominence: 3
        confidence: probable
        sources: [wikipedia:Göktürk_civil_war]
      - { id: orkhon, date: 732 CE, label: "The Orkhon inscriptions: the oldest Turkic writing", prominence: 3, thread: scripts, sources: [wikipedia:Orkhon_inscriptions] }
    sources: [wikipedia:Turkic_Khaganate]

  - id: southern-xiongnu
    name: Southern Xiongnu
    region: steppe
    sphere: steppe
    prominence: 4
    span: 48 – 216 CE
    sources: [wikipedia:Southern_Xiongnu]

  - id: hephthalites
    name: Hephthalites
    region: steppe
    group: central-asia
    sphere: steppe
    prominence: 4
    span: c. 440 – c. 560 CE
    cliopatria: ["White Huns"]
    events:
      - id: peroz
        date: 484 CE
        label: Hephthalites kill the Persian king Peroz
        prominence: 4
        themes: [war]
        sources: [wikipedia:Battle_of_Herat_(484)]
    sources: [wikipedia:Hephthalites]
