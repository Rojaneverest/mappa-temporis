      - { id: steppe-wagons, date: c. 3000 BCE, label: "Wagon-dwelling herders roam the Pontic steppe — likely speakers of Proto-Indo-European", prominence: 2, themes: [migration, technology], confidence: probable, sources: [wikipedia:Yamnaya_culture] }
      - { id: yamnaya-wagons, date: c. 3000 BCE, label: "Wagons and herds let Yamnaya herders roam the open steppe", prominence: 3, themes: [technology, migration], sources: [wikipedia:Yamnaya_culture] }
      - { id: yamnaya-europe, date: c. 2800 BCE, label: "Steppe ancestry floods into Europe — and Indo-European languages with it", prominence: 2, themes: [migration], confidence: probable, sources: [wikipedia:Indo-European_migrations] }
