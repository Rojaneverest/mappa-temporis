# Build the chart and the explorer, then publish to GitHub Pages on every push to main.
#
# Images (apps/explorer/public/img) and the Atlas (apps/explorer/public/atlas) are committed:
# they need a macOS cut-out tool and a 172 MB dataset, so they are made locally with
# `pnpm images` and `pnpm atlas`. Everything else is compiled here from content/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the chart (all sheets)
        run: pnpm build:chart
      - name: Build the explorer
        run: pnpm --filter explorer build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
