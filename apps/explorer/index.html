<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mappa Temporis</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d2; }
      body { font: 13px/1.4 ui-sans-serif, -apple-system, 'Helvetica Neue', sans-serif; color: #2b2420; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; cursor: grab; display: block; }
      #view.dragging { cursor: grabbing; }
      #status {
        position: fixed; right: 14px; bottom: 12px; padding: 6px 10px; border-radius: 8px;
        background: rgba(43, 36, 32, 0.78); color: #f3ead8; font-variant-numeric: tabular-nums;
        pointer-events: none; white-space: pre; font-size: 12px;
      }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font: italic 18px Georgia, serif; color: #6b5f55; }
      #folio {
        position: fixed; top: 76px; right: 14px; bottom: 56px; width: 372px; overflow: auto;
        background: #f7f1e3; border: 1px solid rgba(107, 95, 85, 0.35); border-radius: 10px;
        box-shadow: 0 12px 32px rgba(60, 40, 20, 0.18); padding: 18px 20px 22px;
        transform: translateX(420px); transition: transform 0.28s cubic-bezier(.2,.7,.2,1); z-index: 5;
      }
      #folio.open { transform: none; }
      #folio .close { position: sticky; top: 0; float: right; margin: -8px -10px 0 0; border: 0; background: none; font-size: 22px; color: #6b5f55; cursor: pointer; }
      #folio .kicker { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a7c6e; }
      #folio .kicker a { color: inherit; }
      #folio .endonym { font: 600 44px/1.1 'Songti SC', 'Noto Serif TC', serif; color: #b8392d; margin: 10px 0 2px; }
      #folio .endonym span { font: italic 13px Georgia, serif; color: #8a7c6e; margin-left: 10px; vertical-align: middle; }
      #folio h2 { font: 600 24px/1.2 Georgia, 'Times New Roman', serif; margin: 6px 0 6px; }
      #folio h3 { font: 600 11px/1 ui-sans-serif, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a7c6e; margin: 20px 0 8px; border-top: 1px solid rgba(107,95,85,.2); padding-top: 14px; }
      #folio .dates { color: #6b5f55; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #folio .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: rgba(107,95,85,.12); color: #6b5f55; }
      #folio .badge.p1 { background: #b8392d; color: #fff8ee; } #folio .badge.p2 { background: rgba(184,57,45,.18); color: #7a2219; }
      #folio .badge.warn { background: rgba(224,184,58,.28); color: #6b4d00; }
      #folio .note { font: 15px/1.5 'Source Serif 4', Georgia, serif; color: #2b2420; margin: 12px 0; }
      #folio .sides { font: 600 13px/1.4 ui-sans-serif, sans-serif; color: #6b5f55; margin: 8px 0 0; }
      #folio blockquote.voice { font: italic 18px/1.45 'Source Serif 4', Georgia, serif; color: #2b2420; margin: 14px 0; padding-left: 14px; border-left: 2px solid #c9b48a; }
      #folio blockquote.voice cite { display: block; margin-top: 8px; font: 12px ui-sans-serif, sans-serif; font-style: normal; color: #8a7c6e; }
      #folio .list.voices q { font-style: italic; }
      #folio .forces { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
      #folio .force { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 9px; border-radius: 99px; color: #fffdf6; background: #6b5f55; }
      #folio .force.climate { background: #3c7a86; } #folio .force.migration { background: #8a6a34; } #folio .force.disease { background: #6e7f2e; }
      #folio .force.war { background: #9c2e2e; } #folio .force.technology { background: #4c5c7e; } #folio .force.ideas { background: #7a4c8c; }
      #folio .wiki p { font: 15px/1.55 Georgia, serif; margin: 14px 0 6px; }
      #folio .wiki .attr, #folio .wiki .loading { font: 11px ui-sans-serif, sans-serif; color: #8a7c6e; }
      #folio figure { margin: 14px 0 4px; } #folio figure img { width: 100%; display: block; }
      #folio figure.plate img { border: 6px solid #fffaf0; box-shadow: 0 2px 8px rgba(60,40,20,.25); }
      #folio figure.coin img { width: 62%; margin: 0 auto; }
      #folio figcaption { font: italic 13px/1.4 Georgia, serif; margin-top: 8px; } #folio figcaption span { font: 11px ui-sans-serif, sans-serif; color: #8a7c6e; font-style: normal; }
      #folio .list { list-style: none; padding: 0; margin: 0; }
      #folio .list li { padding: 4px 0; display: flex; gap: 10px; } #folio .list li span { flex: 0 0 104px; color: #8a7c6e; font-variant-numeric: tabular-nums; }
      #folio .list a { color: inherit; text-decoration: none; display: flex; gap: 10px; } #folio .list a:hover { color: #b8392d; }
      #folio .list em { color: #8a7c6e; font-size: 11px; }
      #folio .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
      #folio .thumbs img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #efe6d2; border-radius: 6px; }
      #folio .sources { padding-left: 18px; margin: 0; } #folio .sources a { color: #7a2219; }
      /* Tools hide behind a compass rose in the corner of the frame (where the ruler meets the headers). */
      #seal { position: fixed; top: calc((var(--hud-h, 44px) - 36px) / 2); left: 14px; z-index: 7; width: 36px; height: 36px; transition: top .2s ease; padding: 0; border: 0; border-radius: 50%;
        background: none; cursor: pointer; filter: drop-shadow(0 1px 2px rgba(60,40,20,.25)); }
      #seal svg { width: 36px; height: 36px; display: block; transition: transform .35s cubic-bezier(.3,.7,.2,1); }
      #seal:hover svg { transform: rotate(22.5deg); }
      #seal[aria-expanded="true"] svg { transform: rotate(45deg); }
      #seal .disc { fill: #f7f1e3; stroke: #2b2420; stroke-width: 1.3; }
      #seal .ring { fill: none; stroke: #2b2420; stroke-width: .6; }
      #seal .ticks line { stroke: #2b2420; stroke-width: .7; }
      #seal .d { fill: #2b2420; } #seal .l { fill: #f7f1e3; stroke: #2b2420; stroke-width: .5; stroke-linejoin: round; } #seal .n { fill: #B8392D; }
      #seal .hub { fill: #f7f1e3; stroke: #2b2420; stroke-width: .7; }
      #seal .badge { position: absolute; top: 0; right: 0; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #f7f1e3; display: none; }
      #seal .badge.on { display: block; }
      #seal:focus-visible { outline: 2px solid #B8392D; outline-offset: 2px; }
      #toolbar { position: fixed; top: 76px; left: 76px; z-index: 4; display: flex; gap: 8px; }
      #toolbar.collapsed button { display: none; }
      #toolbar:not(.collapsed) button { animation: tool-in .22s cubic-bezier(.3,.7,.2,1) both; }
      #toolbar button:nth-child(2) { animation-delay: .02s; } #toolbar button:nth-child(3) { animation-delay: .04s; }
      #toolbar button:nth-child(4) { animation-delay: .06s; } #toolbar button:nth-child(5) { animation-delay: .08s; } #toolbar button:nth-child(6) { animation-delay: .1s; }
      @keyframes tool-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #toolbar:not(.collapsed) button { animation: none; } #seal svg { transition: none; } }
      #toolbar button { border: 1px solid rgba(107,95,85,.35); border-radius: 8px; background: rgba(247,241,227,.95); color: #2b2420;
        font: 600 12px ui-sans-serif, sans-serif; padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
      #toolbar button:hover { border-color: rgba(107,95,85,.6); }
      #toolbar #search-btn { color: #6b5f55; font-weight: 400; }
      #toolbar .dot { width: 9px; height: 9px; border-radius: 50%; display: none; }
      #toolbar .dot.on { display: inline-block; }
      .menu, #layers {
        position: fixed; top: 112px; left: 76px; z-index: 6; width: 300px; max-height: calc(100vh - 150px); overflow: auto; padding: 12px 14px; display: none;
        background: #f7f1e3; border: 1px solid rgba(107,95,85,.35); border-radius: 10px; box-shadow: 0 10px 28px rgba(60,40,20,.16);
        font: 13px/1.4 ui-sans-serif, sans-serif; color: #2b2420;
      }
      #layers.open, .menu.open { display: block; }
      .menu h4 { margin: 0 0 8px; font: 600 11px ui-sans-serif, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a7c6e; }
      .menu label, .menu .row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; cursor: pointer; border-radius: 6px; }
      .menu .row:hover, .menu label:hover { background: rgba(184,57,45,.07); }
      .menu .row.on { background: rgba(184,57,45,.12); }
      .menu .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
      .menu .bar { width: 18px; height: 4px; border-radius: 2px; flex: none; }
      .menu .n { margin-left: auto; color: #8a7c6e; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; text-decoration: none; }
      .menu a.n:hover { color: #b8392d; }
      .menu p { margin: 8px 0 0; font-size: 11px; color: #8a7c6e; }
      .menu .desc { display: block; font-size: 11px; color: #8a7c6e; margin-top: 1px; }
      #lens-chip { display: none; align-items: center; gap: 8px;
        padding: 4px 6px 4px 10px; border-radius: 16px; background: rgba(247,241,227,.97); border: 1px solid rgba(107,95,85,.35);
        box-shadow: 0 6px 18px rgba(60,40,20,.14); font: 600 12px ui-sans-serif, sans-serif; color: #2b2420; }
      #lens-chip.on { display: flex; }
      #lens-chip .swatch { width: 10px; height: 10px; border-radius: 50%; }
      #lens-chip span.n { font-weight: 400; color: #8a7c6e; }
      #lens-chip button { border: 0; background: none; font-size: 16px; line-height: 1; color: #6b5f55; cursor: pointer; padding: 0 4px; }
      #folio .follow { display: flex; align-items: center; gap: 8px; margin: -4px 0 12px; padding: 8px 10px; border-radius: 8px; background: rgba(184,57,45,.07); font: 12px ui-sans-serif, sans-serif; }
      #folio .follow .bar { width: 18px; height: 4px; border-radius: 2px; }
      #folio .follow button { border: 1px solid rgba(107,95,85,.35); background: #fffaf0; border-radius: 6px; padding: 3px 8px; cursor: pointer; font: 600 12px ui-sans-serif, sans-serif; }
      #folio .follow button:disabled { opacity: .35; cursor: default; }
      #folio .follow .stop { margin-left: auto; color: #8a7c6e; font-variant-numeric: tabular-nums; }
      #folio button.start { border: 1px solid rgba(107,95,85,.35); background: #fffaf0; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: 600 12px ui-sans-serif, sans-serif; margin: 4px 0 8px; }
      #folio .mw-nav { display: flex; gap: 6px; margin: 6px 0 4px; }
      #folio .mw-nav button { border: 1px solid rgba(107,95,85,.35); background: #fffaf0; border-radius: 6px; padding: 3px 8px; cursor: pointer; font: 12px ui-sans-serif, sans-serif; }
      #folio .mw-region { margin-top: 16px; padding-top: 10px; border-top: 1px solid rgba(107,95,85,.2); }
      #folio .mw-region h3 { margin-top: 0; }
      #folio .mw-states { font: 13px/1.5 Georgia, serif; } #folio .mw-states a { color: inherit; text-decoration: none; } #folio .mw-states a:hover { color: #b8392d; }
      #folio .mw-off { color: #8a7c6e; font-size: 11px; }
      #layers h4 { margin: 0 0 8px; font: 600 11px ui-sans-serif, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a7c6e; }
      #layers label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
      #layers .swatch { width: 18px; height: 4px; border-radius: 2px; }
      #layers .go { margin-left: auto; color: #8a7c6e; text-decoration: none; font-size: 12px; }
      #layers .go:hover { color: #b8392d; }
      #layers p { margin: 8px 0 0; font-size: 11px; color: #8a7c6e; }
      #atlas {
        position: fixed; left: 76px; bottom: 48px; z-index: 3; padding: 8px 8px 6px; border-radius: 10px;
        background: rgba(247,241,227,.96); border: 1px solid rgba(107,95,85,.35); box-shadow: 0 10px 28px rgba(60,40,20,.14);
      }
      #atlas.hidden { display: none; }
      #atlas canvas { display: block; }
      #search { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 6; width: min(560px, 70vw); display: none; }
      #search.open { display: block; }
      #search input { width: 100%; box-sizing: border-box; font: 16px Georgia, serif; padding: 12px 16px; border-radius: 10px;
        border: 1px solid rgba(107,95,85,.45); background: #fffaf0; color: #2b2420; box-shadow: 0 14px 36px rgba(60,40,20,.2); outline: none; }
      #search ul { list-style: none; margin: 6px 0 0; padding: 4px; background: #f7f1e3; border-radius: 10px; border: 1px solid rgba(107,95,85,.3);
        box-shadow: 0 14px 36px rgba(60,40,20,.18); max-height: 60vh; overflow: auto; }
      #search ul:empty { display: none; }
      #search li { padding: 8px 12px; border-radius: 7px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
      #search li.on, #search li:hover { background: rgba(184,57,45,.1); }
      #search li .t { font: 15px Georgia, serif; color: #2b2420; } #search li .m { font: 11px ui-sans-serif, sans-serif; color: #8a7c6e; }
      #search li.none { color: #8a7c6e; cursor: default; }
      #atlas .caption { font: 600 12px ui-sans-serif, sans-serif; color: #2b2420; padding: 6px 2px 0; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status"></div>
    <div id="loading">Unrolling the map…</div>
    <aside id="folio" aria-label="Details"></aside>
    <button id="seal" aria-expanded="false" aria-controls="toolbar" title="Tools (.)" aria-label="Tools">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle class="disc" cx="24" cy="24" r="22.6"/><circle class="ring" cx="24" cy="24" r="19.2"/>
        <g class="ticks"><line x1="24.00" y1="4.80" x2="24.00" y2="3.40"/><line x1="27.75" y1="5.17" x2="27.88" y2="4.48"/><line x1="31.35" y1="6.26" x2="31.88" y2="4.97"/><line x1="34.67" y1="8.04" x2="35.06" y2="7.45"/><line x1="37.58" y1="10.42" x2="38.57" y2="9.43"/><line x1="39.96" y1="13.33" x2="40.55" y2="12.94"/><line x1="41.74" y1="16.65" x2="43.03" y2="16.12"/><line x1="42.83" y1="20.25" x2="43.52" y2="20.12"/><line x1="43.20" y1="24.00" x2="44.60" y2="24.00"/><line x1="42.83" y1="27.75" x2="43.52" y2="27.88"/><line x1="41.74" y1="31.35" x2="43.03" y2="31.88"/><line x1="39.96" y1="34.67" x2="40.55" y2="35.06"/><line x1="37.58" y1="37.58" x2="38.57" y2="38.57"/><line x1="34.67" y1="39.96" x2="35.06" y2="40.55"/><line x1="31.35" y1="41.74" x2="31.88" y2="43.03"/><line x1="27.75" y1="42.83" x2="27.88" y2="43.52"/><line x1="24.00" y1="43.20" x2="24.00" y2="44.60"/><line x1="20.25" y1="42.83" x2="20.12" y2="43.52"/><line x1="16.65" y1="41.74" x2="16.12" y2="43.03"/><line x1="13.33" y1="39.96" x2="12.94" y2="40.55"/><line x1="10.42" y1="37.58" x2="9.43" y2="38.57"/><line x1="8.04" y1="34.67" x2="7.45" y2="35.06"/><line x1="6.26" y1="31.35" x2="4.97" y2="31.88"/><line x1="5.17" y1="27.75" x2="4.48" y2="27.88"/><line x1="4.80" y1="24.00" x2="3.40" y2="24.00"/><line x1="5.17" y1="20.25" x2="4.48" y2="20.12"/><line x1="6.26" y1="16.65" x2="4.97" y2="16.12"/><line x1="8.04" y1="13.33" x2="7.45" y2="12.94"/><line x1="10.42" y1="10.42" x2="9.43" y2="9.43"/><line x1="13.33" y1="8.04" x2="12.94" y2="7.45"/><line x1="16.65" y1="6.26" x2="16.12" y2="4.97"/><line x1="20.25" y1="5.17" x2="20.12" y2="4.48"/></g>
        <path class="d" d="M24 24L31.42 16.58L22.16 22.16Z"/><path class="l" d="M24 24L31.42 16.58L25.84 25.84Z"/><path class="d" d="M24 24L31.42 31.42L25.84 22.16Z"/><path class="l" d="M24 24L31.42 31.42L22.16 25.84Z"/><path class="d" d="M24 24L16.58 31.42L25.84 25.84Z"/><path class="l" d="M24 24L16.58 31.42L22.16 22.16Z"/><path class="d" d="M24 24L16.58 16.58L22.16 25.84Z"/><path class="l" d="M24 24L16.58 16.58L25.84 22.16Z"/>
        <path class="n" d="M24 24L24.00 7.50L20.60 24.00Z"/><path class="l" d="M24 24L24.00 7.50L27.40 24.00Z"/><path class="d" d="M24 24L40.50 24.00L24.00 20.60Z"/><path class="l" d="M24 24L40.50 24.00L24.00 27.40Z"/><path class="d" d="M24 24L24.00 40.50L27.40 24.00Z"/><path class="l" d="M24 24L24.00 40.50L20.60 24.00Z"/><path class="d" d="M24 24L7.50 24.00L24.00 27.40Z"/><path class="l" d="M24 24L7.50 24.00L24.00 20.60Z"/>
        <circle class="hub" cx="24" cy="24" r="2.1"/>
      </svg>
      <span class="badge"></span>
    </button>
    <nav id="toolbar" class="collapsed" aria-label="Tools">
      <button id="layers-btn" aria-expanded="false" title="Layers (L)">Layers</button>
      <button id="lenses-btn" aria-expanded="false" title="Lenses (K)"><span class="dot"></span>Lenses</button>
      <button id="threads-btn" aria-expanded="false" title="Threads (T)">Threads</button>
      <button id="meanwhile-btn" title="Everything happening at one year (Y, or click the year ruler)">Meanwhile</button>
      <button id="atlas-btn" aria-pressed="true" title="Atlas (A)">Atlas</button>
      <button id="search-btn" title="Search (⌘K or /)">Search ⌘K</button>
      <div id="lens-chip" role="status"></div>
    </nav>
    <div id="layers" role="dialog" aria-label="Layers"></div>
    <div id="lenses-menu" class="menu" role="dialog" aria-label="Lenses"></div>
    <div id="threads-menu" class="menu" role="dialog" aria-label="Threads"></div>
    <div id="search"></div>
    <div id="atlas" aria-label="Atlas: the world in the year under the cursor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
